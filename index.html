<script>
/* Read-only stand-in for the Claude page runtime: serves the daily snapshot in data.json. */
(function(){
  let data = null;
  const load = () => data || (data = fetch("data.json?t=" + Date.now()).then(r => r.json()));
  const snap = (docs, p) => ({ id: p.split("/").pop(), exists: p in docs, data: () => docs[p], metadata: {} });
  const refuse = async () => { throw { code: "invalid_argument", message: "read-only" }; };
  const doc = p => ({ id: p.split("/").pop(), path: p, get: async () => snap((await load()).docs, p), set: refuse, update: refuse, delete: refuse,
    onSnapshot(next){ load().then(d => next(snap(d.docs, p))); return () => {}; } });
  const coll = c => { const q = { path: c, limit: () => q, doc: id => doc(c + "/" + id),
    onSnapshot(next){ load().then(d => { const n = c.split("/").length + 1;
      const docs = Object.keys(d.docs).filter(k => k.startsWith(c + "/") && k.split("/").length === n).sort().map(k => snap(d.docs, k));
      next({ docs, size: docs.length, empty: !docs.length }); }); return () => {}; } }; return q; };
  window.claude = { use: async name => name === "db" ? { doc, collection: coll } : name === "user" ? { can: async () => false } : null };
  window.addEventListener("DOMContentLoaded", () => load().then(d => {
    const p = document.createElement("p"); p.className = "pubnote";
    const t = new Date(d.generated);
    p.textContent = "Public scoreboard. Refreshed each morning during the season; last refresh " +
      t.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + ".";
    document.body.appendChild(p);
  }).catch(() => {}));
})();
</script>

<title>The Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a trading-floor ledger. Wordmark + live ticker on top, tabbed desk below; tables carry the page. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1; --fg:#14201a; --muted:#5d6b62;
  --accent:#0d6a45; --accent-ink:#ffffff; --accent-soft:#dcefe4;
  --up:#0d7a4b; --down:#b4362b; --gold:#a07612;
  --ticker-bg:#0f2a1e; --ticker-fg:#d9efe2;
  --nfl:#1f4e9c; --acc:#c25412; --b10:#2d6fb8; --b12:#b8292f; --sec:#7a3fa5; --np4:#4f7a2a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* masthead */
header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.season-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.season-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg)}

/* ticker */
.ticker{background:var(--ticker-bg);color:var(--ticker-fg);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:12.5px;border-block:1px solid var(--line)}
.ticker-track{display:inline-flex;gap:28px;padding:8px 0;animation:tick 60s linear infinite;padding-left:16px}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk b{font-weight:600;color:#fff}
.tk .w{color:#5fe0a0}.tk .l{color:#ff8f84}.tk .o{opacity:.65}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker{overflow-x:auto}.ticker-track{animation:none}}
:root[data-theme="light"] .tk b{color:#fff}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:12px 14px 10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:20px 60px}
section.panel{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:0}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto;min-width:0}

/* standings */
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.st td{border-bottom:1px solid var(--line)}
.st tr.row{cursor:pointer}
.st tr.row:hover td{background:var(--sunk)}
.st tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.r{text-align:right}
.rk{width:34px;color:var(--muted)}
.mgr{font-weight:600}
.tot{font-size:20px;font-weight:600}
.lead .rk{color:var(--gold);font-weight:700}
.chev{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
tr.open .chev{transform:rotate(90deg)}
.delta.up{color:var(--up)}.delta.zero{color:var(--muted)}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:5px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--accent)}
.detail td{background:var(--sunk);padding:12px 12px 14px}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px}
.h-item{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 0}
.h-item .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-item .rec{font-family:var(--mono);font-size:13px}

.chip{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.p-NFL{--c:var(--nfl)}.p-ACC{--c:var(--acc)}.p-Big-Ten{--c:var(--b10)}.p-Big-12{--c:var(--b12)}.p-SEC{--c:var(--sec)}.p-Non-P4{--c:var(--np4)}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ld{padding:12px;display:flex;flex-direction:column;gap:4px}
.ld .t{font-weight:600}
.ld .o{font-size:12.5px;color:var(--muted)}
.ld .n{font-family:var(--mono);font-size:22px;font-weight:600}

/* board */
.board th,.board td{border:1px solid var(--line);font-size:13px;vertical-align:top}
.board thead th{background:var(--surface);position:sticky;top:0}
.board td{min-width:118px;background:var(--surface)}
.board td.slot{min-width:84px;background:var(--sunk);font-weight:600}
.cell{display:flex;flex-direction:column;gap:2px}
.cell .rec{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell.hot{box-shadow:inset 3px 0 0 var(--up)}
.cell.cold{box-shadow:inset 3px 0 0 var(--down)}
.board td.tot-row{font-family:var(--mono);font-weight:600;background:var(--sunk)}

/* forms */
.form{padding:16px;display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--down)}.msg.ok{color:var(--up)}

/* results log */
.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.game{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.game:last-child{border-bottom:0}
.side{display:flex;flex-direction:column;min-width:0}
.side.right{text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.won .nm{font-weight:700}
.side .own{font-size:11.5px;color:var(--accent);font-weight:600}
.score{font-family:var(--mono);font-weight:600;white-space:nowrap}
.lg{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:13px}
.x:hover{color:var(--down)}
.x.confirm{color:var(--accent-ink);background:var(--down)}
details.pend{padding:12px 14px}
details.pend summary{cursor:pointer;font-weight:600;font-size:14px}
.pend-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}

/* draft */
.clock{padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-color:var(--accent)}
.clock .who{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.clock .meta{color:var(--muted);font-size:13px}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.need.done{opacity:.35;text-decoration:line-through}
.avail{max-height:560px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:12px}
.av{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.av:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.av:disabled{opacity:.35;cursor:not-allowed}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.feed .pk{font-family:var(--mono);color:var(--muted);width:46px}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.clock{grid-template-columns:1fr}}

.empty{padding:32px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.ro{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

@media (max-width:520px){
  th,td{padding:9px 5px}
  .hide-sm{display:none}
  .tot{font-size:18px}
  .game{grid-template-columns:1fr auto 1fr;}
  .game .x{grid-column:1/-1;justify-self:end}
}

/* leagues */
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lg-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.lg-card.cur{border-color:var(--accent)}
.lg-card .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.lg-card .kv{font-size:13px;color:var(--muted)}
.lg-card .kv b{color:var(--fg);font-weight:600}
.status{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:var(--accent);border-color:var(--accent)}
.mgr-list{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.mgr-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mgr-list .ord{font-family:var(--mono);color:var(--muted);width:24px}
.mgr-list .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;width:30px;height:30px;cursor:pointer;line-height:1}
.ib:hover:not(:disabled){border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.dot.off{background:var(--muted)}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:uppercase}
.rounds td{min-width:112px}
.rounds .pkn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.league-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.league-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);max-width:240px}
</style>

<header class="mast">
  <div class="wrap mast-row">
    <div class="brand">
      <h1>The <span>Portfolio</span></h1>
      <p id="tagline">Draft teams, not players. Most wins takes the table.</p>
    </div>
    <label class="league-pick" for="leagueSel">League
      <select id="leagueSel"><option>Loading…</option></select>
    </label>
  </div>
</header>
<div class="ticker" id="ticker" aria-label="Latest results for drafted teams"><div class="ticker-track" id="tickerTrack"><span class="tk o">Loading the latest results…</span></div></div>

</nav>
<main class="wrap" id="main">
  <section class="panel card empty"><strong>Opening the league…</strong>Standings, rosters and results load from the shared league file.</section>
</main>

<script>
/* Every NFL team and all 138 FBS teams for 2026. Notre Dame sits in the ACC pool; every FBS team outside the Power 4 is Non-P4. */
const POOL = {
"NFL":["49ers","Bears","Bengals","Bills","Broncos","Browns","Buccaneers","Cardinals","Chargers","Chiefs","Colts","Commanders","Cowboys","Dolphins","Eagles","Falcons","Giants","Jaguars","Jets","Lions","Packers","Panthers","Patriots","Raiders","Rams","Ravens","Saints","Seahawks","Steelers","Texans","Titans","Vikings"],
"ACC":["Boston College","California","Clemson","Duke","Florida State","Georgia Tech","Louisville","Miami","NC State","North Carolina","Notre Dame","Pittsburgh","SMU","Stanford","Syracuse","Virginia","Virginia Tech","Wake Forest"],
"Big Ten":["Illinois","Indiana","Iowa","Maryland","Michigan","Michigan State","Minnesota","Nebraska","Northwestern","Ohio State","Oregon","Penn State","Purdue","Rutgers","UCLA","USC","Washington","Wisconsin"],
"Big 12":["Arizona","Arizona State","BYU","Baylor","Cincinnati","Colorado","Houston","Iowa State","Kansas","Kansas State","Oklahoma State","TCU","Texas Tech","UCF","Utah","West Virginia"],
"SEC":["Alabama","Arkansas","Auburn","Florida","Georgia","Kentucky","LSU","Mississippi State","Missouri","Oklahoma","Ole Miss","South Carolina","Tennessee","Texas","Texas A&M","Vanderbilt"],
"Non-P4":["Air Force","Akron","Appalachian State","Arkansas State","Army","Ball State","Boise State","Bowling Green","Buffalo","Central Michigan","Charlotte","Coastal Carolina","Colorado State","Delaware","East Carolina","Eastern Michigan","FIU","Florida Atlantic","Fresno State","Georgia Southern","Georgia State","Hawaii","Jacksonville State","James Madison","Kennesaw State","Kent State","Liberty","Louisiana","Louisiana Tech","Louisiana-Monroe","Marshall","Memphis","Miami (OH)","Middle Tennessee","Missouri State","Navy","Nevada","New Mexico","New Mexico State","North Dakota State","North Texas","Northern Illinois","Ohio","Old Dominion","Oregon State","Rice","Sacramento State","Sam Houston","San Diego State","San Jose State","South Alabama","South Florida","Southern Miss","Temple","Texas State","Toledo","Troy","Tulane","Tulsa","UAB","UConn","UMass","UNLV","UTEP","UTSA","Utah State","Washington State","Western Kentucky","Western Michigan","Wyoming"]};
const POOLS = ["NFL","ACC","Big Ten","Big 12","SEC","Non-P4"];
const DEFAULT_SLOTS = {"NFL":3,"ACC":1,"Big Ten":1,"Big 12":1,"SEC":1,"Non-P4":1};
/* Spellings other score sources use, mapped to the names above. */
const ALIAS = {"miami (fla.)":"Miami","miami (fl)":"Miami","miami fl":"Miami","miami-fl":"Miami","miami (oh)":"Miami (OH)","miami-oh":"Miami (OH)","miami (ohio)":"Miami (OH)","miami oh":"Miami (OH)","miami ohio":"Miami (OH)","miss. state":"Mississippi State","ga. southern":"Georgia Southern","ga. tech":"Georgia Tech","va. tech":"Virginia Tech","ul-monroe":"Louisiana-Monroe","ul monroe":"Louisiana-Monroe","ulm":"Louisiana-Monroe","louisiana monroe":"Louisiana-Monroe","louisiana-lafayette":"Louisiana","ul-lafayette":"Louisiana","c. michigan":"Central Michigan","cent. michigan":"Central Michigan","e. michigan":"Eastern Michigan","w. michigan":"Western Michigan","n. illinois":"Northern Illinois","niu":"Northern Illinois","app. state":"Appalachian State","app state":"Appalachian State","so. miss":"Southern Miss","southern mississippi":"Southern Miss","southern miss.":"Southern Miss","w. kentucky":"Western Kentucky","wku":"Western Kentucky","middle tenn.":"Middle Tennessee","middle tennessee state":"Middle Tennessee","mtsu":"Middle Tennessee","fau":"Florida Atlantic","florida international":"FIU","c. carolina":"Coastal Carolina","pitt":"Pittsburgh","n.c. state":"NC State","north carolina state":"NC State","massachusetts":"UMass","connecticut":"UConn","southern methodist":"SMU","central florida":"UCF","brigham young":"BYU","mississippi":"Ole Miss","texas christian":"TCU","louisiana state":"LSU","southern california":"USC","hawai'i":"Hawaii","san josé state":"San Jose State","la. tech":"Louisiana Tech","la tech":"Louisiana Tech","sam houston state":"Sam Houston","ut san antonio":"UTSA","texas-san antonio":"UTSA","texas-el paso":"UTEP","alabama-birmingham":"UAB","army west point":"Army","n. texas":"North Texas","s. florida":"South Florida","usf":"South Florida","e. carolina":"East Carolina","ecu":"East Carolina","s. carolina":"South Carolina","n. carolina":"North Carolina","unc":"North Carolina","w. virginia":"West Virginia","boston col.":"Boston College","ndsu":"North Dakota State","n. dakota state":"North Dakota State","s. alabama":"South Alabama","cal":"California","jax state":"Jacksonville State","nevada-las vegas":"UNLV","bowling green state":"Bowling Green"};

const S = { db:null, canWrite:false, leagues:[], leaguesLoaded:false, leagueId:null, gameDocs:[], sync:null,
  tab:"standings", open:new Set(), onlyMine:true, weeksShown:2, draftPool:"all", draftQ:"",
  confirmDel:null, confirmLg:null, newMgrs:[], reset:new Set() };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const poolCls = p => "p-" + String(p).replace(/\s+/g,"-");
const chip = p => `<span class="chip ${poolCls(p)}">${esc(p==="Big Ten"?"B1G":p==="Big 12"?"B12":p)}</span>`;

/* ---------- team names ---------- */
const CFB = new Map(), NFL = new Map(POOL.NFL.map(t=>[t.toLowerCase(),t])), POOL_OF = {};
for (const p of POOLS) for (const t of POOL[p]) { POOL_OF[(p==="NFL"?"n:":"c:")+t.toLowerCase()] = p; if (p!=="NFL") CFB.set(t.toLowerCase(), t); }
function canonName(name, lg){
  const s = String(name||"").trim().replace(/\s+/g," ");
  const low = s.toLowerCase().replace(/[’`ʻ]/g,"'");
  if (lg==="NFL"){ if (NFL.has(low)) return NFL.get(low); return NFL.get(low.split(" ").pop()) || s; }
  if (ALIAS[low]) return ALIAS[low];
  if (CFB.has(low)) return CFB.get(low);
  const st = low.replace(/\bst\.?$/,"state");
  if (ALIAS[st]) return ALIAS[st];
  if (CFB.has(st)) return CFB.get(st);
  return st!==low ? s.replace(/\bSt\.?$/i,"State") : s;
}
const tk = (name, lg) => (lg==="NFL"?"n:":"c:") + canonName(name, lg).toLowerCase();
const pk = p => tk(p.team, p.pool==="NFL"?"NFL":"CFB");

/* ---------- dates: league week runs Tuesday through Monday ---------- */
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const weekStart = s => { const d = toD(s); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+5)%7)); return iso(d); };
const weekEnd = ws => iso(new Date(toD(ws).getTime()+6*864e5));
const fmtDay = s => toD(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const fmtShort = s => toD(s).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const todayISO = () => { const n = new Date(); return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))); };
const seasonLabel = y => `${y}–${String(y+1).slice(2)}`;
const thisSeason = () => { const n = new Date(); return n.getMonth()>=2 ? n.getFullYear() : n.getFullYear()-1; };

/* ---------- league helpers ---------- */
const league = () => S.leagues.find(l=>l.id===S.leagueId) || null;
const slotsOf = L => L.slots || DEFAULT_SLOTS;
const roundsOf = L => POOLS.reduce((n,p)=> n + (slotsOf(L)[p]||0), 0);
function slotRows(L){ const out=[]; for (const p of POOLS){ const n=slotsOf(L)[p]||0; for (let i=1;i<=n;i++) out.push({slot: n>1?`${p} #${i}`:p, pool:p, ix:i, many:n>1}); } return out; }
const slotText = L => POOLS.filter(p=>slotsOf(L)[p]).map(p=>`${slotsOf(L)[p]} ${p}`).join(" · ");

/* ---------- games: one list for every league, de-duplicated ---------- */
let _games = null;
function allGames(){
  if (_games) return _games;
  const seen = new Map();
  for (const d of S.gameDocs) (d.games||[]).forEach(g=>{
    const lg = g.lg==="NFL"?"NFL":"CFB", date = g.date||d.date, hs=+g.hs, as=+g.as;
    if (!/^\d{4}-\d\d-\d\d$/.test(date||"") || !isFinite(hs) || !isFinite(as) || !g.home || !g.away) return;
    const G = {doc:d._id, lg, date, home:canonName(g.home,lg), away:canonName(g.away,lg), rawHome:g.home, rawAway:g.away, hs, as, rank:({auto:1,sheet:2})[g.src||d.src]||3};
    const a = tk(G.home,lg), b = tk(G.away,lg);
    G.hk=a; G.ak=b;
    const k = weekStart(date)+"|"+(a<b?a+"|"+b:b+"|"+a);
    const prev = seen.get(k);
    if (!prev || G.rank>prev.rank) seen.set(k, G);   // a hand-entered result outranks an automatic one
  });
  return _games = [...seen.values()].sort((x,y)=> x.date<y.date?-1:x.date>y.date?1:0);
}
const winnerKey = g => g.hs===g.as ? null : (g.hs>g.as ? g.hk : g.ak);

function compute(L){
  const y = L.year || thisSeason();
  const lo = `${y}-07-01`, hi = `${y+1}-06-30`;
  const games = allGames().filter(g=> g.date>=lo && g.date<=hi);
  const rec = {}; const R = k => rec[k] || (rec[k] = {w:0,l:0,t:0,games:[]});
  for (const g of games){
    if (g.hs===g.as){ R(g.hk).t++; R(g.ak).t++; }
    else if (g.hs>g.as){ R(g.hk).w++; R(g.ak).l++; }
    else { R(g.ak).w++; R(g.hk).l++; }
    R(g.hk).games.push(g); R(g.ak).games.push(g);
  }
  const lastDate = games.length ? games[games.length-1].date : null;
  const curWeek = lastDate ? weekStart(lastDate) : null;
  const firstWeek = games.length ? weekStart(games[0].date) : null;
  const weekNo = curWeek ? Math.round((toD(curWeek)-toD(firstWeek))/(7*864e5))+1 : 0;
  const picks = L.picks || [], owner = {};
  for (const p of picks) owner[pk(p)] = p;
  const order = slotRows(L).map(s=>s.slot);
  const rows = (L.owners||[]).map(o=>{
    let nfl=0, cfb=0, wk=0;
    const holdings = picks.filter(p=>p.owner===o).map(p=>{
      const k = pk(p), r = rec[k] || {w:0,l:0,t:0,games:[]};
      if (p.pool==="NFL") nfl+=r.w; else cfb+=r.w;
      const wkG = r.games.filter(g=>weekStart(g.date)===curWeek);
      wk += wkG.filter(g=>winnerKey(g)===k).length;
      return {...p, k, w:r.w, l:r.l, t:r.t, wkG};
    }).sort((a,b)=> order.indexOf(a.slot)-order.indexOf(b.slot));
    return {owner:o, nfl, cfb, total:nfl+cfb, wk, holdings};
  });
  rows.sort((a,b)=> b.total-a.total || b.nfl-a.nfl || a.owner.localeCompare(b.owner));
  let rank = 0;
  rows.forEach((r,i)=>{ if (i===0 || r.total!==rows[i-1].total) rank=i+1; r.rank=rank; });
  const top = rows[0]?.total || 0; rows.forEach(r=> r.gb = top-r.total);
  return {games, rec, owner, rows, curWeek, weekNo, lastDate, picks};
}

/* ---------- rendering ---------- */
function render(){
  _games = null;
  const main = $("#main");
  const keep = {}; main.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=> keep[e.id]=e.value);
  const ae = document.activeElement, fid = ae && main.contains(ae) ? ae.id : null;
  let sel = null; try{ if (fid && ae.selectionStart!=null) sel=[ae.selectionStart, ae.selectionEnd]; }catch(_){}

  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  renderLeagueSel();
  const L = league();
  if (S.db===null) main.innerHTML = `<section class="card empty"><strong>League data isn't available here.</strong>Open this page in Claude while signed in to see the standings.</section>`;
  else if (!S.leaguesLoaded) main.innerHTML = `<section class="card empty"><strong>Opening the league…</strong>Standings, rosters and results load from the shared league file.</section>`;
  else if (!L){ $("#tagline").textContent = "Draft teams, not players. Most wins takes the table."; renderTicker(null); main.innerHTML = leaguesHTML(); }
  else {
    const C = compute(L);
    renderTicker(C);
    $("#tagline").textContent = `${L.name} · ${seasonLabel(L.year)} season · ${L.owners.length} managers`;
    main.innerHTML = S.tab==="leagues" ? leaguesHTML() : {standings:standingsHTML, board:boardHTML, results:resultsHTML, draft:draftHTML}[S.tab](L, C);
  }
  for (const id in keep){ if (S.reset.has(id)) continue; const el = document.getElementById(id); if (el && el.value!==keep[id]) el.value = keep[id]; }
  S.reset.clear();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); if (sel) try{ el.setSelectionRange(sel[0],sel[1]); }catch(_){} } }
  bind();
}

function renderLeagueSel(){
  const sel = $("#leagueSel");
  sel.innerHTML = S.leagues.length ? S.leagues.map(l=>`<option value="${esc(l.id)}" ${l.id===S.leagueId?"selected":""}>${esc(l.name)} · ${seasonLabel(l.year)}</option>`).join("") : `<option>${S.leaguesLoaded?"No leagues yet":"Loading…"}</option>`;
}

function renderTicker(C){
  const items = [];
  if (C){
    const recent = C.games.filter(g=> C.owner[g.hk] || C.owner[g.ak]).slice(-30).reverse();
    for (const g of recent) for (const side of ["home","away"]){
      const p = C.owner[side==="home"?g.hk:g.ak]; if (!p) continue;
      const mine = side==="home"?g.hs:g.as, theirs = side==="home"?g.as:g.hs;
      const res = mine>theirs?"W":mine<theirs?"L":"T";
      items.push(`<span class="tk"><b>${esc(g[side].toUpperCase())}</b> <span class="${res==="W"?"w":res==="L"?"l":"o"}">${res==="W"?"▲":res==="L"?"▼":"■"} ${res} ${mine}–${theirs}</span> <span class="o">${esc(p.owner)}</span></span>`);
    }
  }
  const html = items.length ? items.join("") : `<span class="tk o">${C?"No results yet for this league's teams.":"Pick or create a league to see its results."}</span>`;
  $("#tickerTrack").innerHTML = items.length ? html+html : html;
}

function standingsHTML(L, C){
  if (!C.picks.length) return `<section class="panel"><div class="card empty"><strong>No rosters yet.</strong>${L.status==="drafting"?"The draft is open on the Draft tab. The table fills in as teams come off the board.":"Run the draft on the Draft tab and the table fills in here."}</div></section>`;
  const max = Math.max(1, ...C.rows.map(r=>r.total));
  const wkLabel = C.curWeek ? `Wk ${C.weekNo}` : "Wk";
  const body = C.rows.map(r=>{
    const open = S.open.has(r.owner);
    const hold = r.holdings.map(h=>{
      const wkTxt = h.wkG.map(g=>{ const w=winnerKey(g); return w===h.k?"W":w===null?"T":"L"; }).join(" ");
      return `<div class="h-item">${chip(h.pool)}<span class="tn">${esc(h.team)}</span><span class="rec">${h.w}-${h.l}${h.t?"-"+h.t:""}</span>${wkTxt?`<span class="lg">${wkTxt}</span>`:""}</div>`;
    }).join("");
    return `<tr class="row ${r.rank===1&&r.total?"lead":""} ${open?"open":""}" tabindex="0" data-owner="${esc(r.owner)}" aria-expanded="${open}">
      <td class="rk num">${r.rank}</td>
      <td><span class="chev">›</span> <span class="mgr">${esc(r.owner)}</span><div class="bar"><i style="width:${(r.total/max*100).toFixed(1)}%"></i></div></td>
      <td class="r num tot">${r.total}</td><td class="r num">${r.nfl}</td><td class="r num">${r.cfb}</td>
      <td class="r num delta ${r.wk?"up":"zero"}">${r.wk?"+"+r.wk:"–"}</td>
      <td class="r num hide-sm">${r.gb?r.gb:"—"}</td>
    </tr>${open?`<tr class="detail"><td colspan="7"><div class="hold">${hold||`<span class="sub">No teams drafted yet.</span>`}</div></td></tr>`:""}`;
  }).join("");
  const leaders = POOLS.map(pool=>{
    const best = C.picks.filter(p=>p.pool===pool).map(p=>({...p, ...(C.rec[pk(p)]||{w:0,l:0})})).sort((a,b)=> b.w-a.w || a.l-b.l)[0];
    return best ? `<div class="card ld">${chip(pool)}<span class="t">${esc(best.team)}</span><span class="n">${best.w}-${best.l}</span><span class="o">${esc(best.owner)}</span></div>` : "";
  }).join("");
  return `<section class="panel">
    <div class="head-row"><h2>The Table</h2><p class="sub">${C.lastDate?`Through ${fmtDay(C.lastDate)} · ${wkLabel} runs ${fmtShort(C.curWeek)}–${fmtShort(weekEnd(C.curWeek))}`:"No games logged yet"}</p></div>
    <div class="card scroll"><table class="st">
      <thead><tr><th>#</th><th>Manager</th><th class="r">Wins</th><th class="r">NFL</th><th class="r">CFB</th><th class="r">${wkLabel}</th><th class="r hide-sm">Back</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <p class="sub">Tap a manager to see their teams. Ties share a rank; order within a tie follows NFL wins.</p>
    <div class="head-row"><h2>Best in each pool</h2></div>
    <div class="leaders">${leaders}</div>
  </section>`;
}

function boardHTML(L, C){
  const owners = L.owners;
  if (!C.picks.length) return `<section class="panel"><div class="card empty"><strong>The board is empty.</strong>Picks appear here as soon as the draft starts.</div></section>`;
  const rows = slotRows(L).map(s=> `<tr><td class="slot">${chip(s.pool)} ${s.many?s.ix:""}</td>${owners.map(o=>{
      const p = C.picks.find(x=>x.owner===o && x.slot===s.slot);
      if (!p) return `<td></td>`;
      const r = C.rec[pk(p)]||{w:0,l:0,t:0}, gp = r.w+r.l+r.t, pct = gp? r.w/gp : null;
      return `<td><div class="cell ${pct===null?"":pct>=.7?"hot":pct<=.3?"cold":""}"><span>${esc(p.team)}</span><span class="rec">${r.w}-${r.l}${r.t?"-"+r.t:""}${p.n?` · pick ${p.n}`:""}</span></div></td>`;
    }).join("")}</tr>`).join("");
  const tot = `<tr><td class="slot">Total</td>${owners.map(o=>`<td class="tot-row">${C.rows.find(r=>r.owner===o)?.total??0} W</td>`).join("")}</tr>`;
  return `<section class="panel">
    <div class="head-row"><h2>Rosters</h2><p class="sub">Columns follow draft order. Green edge: winning 70%+. Red edge: 30% or less.</p></div>
    <div class="card scroll"><table class="board"><thead><tr><th>Slot</th>${owners.map(o=>`<th>${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}${tot}</tbody></table></div>
  </section>`;
}

function teamOptions(C){
  const set = new Map();
  for (const p of POOLS) for (const t of POOL[p]) set.set(t.toLowerCase(), t);
  for (const g of C.games){ set.set(g.home.toLowerCase(), g.home); set.set(g.away.toLowerCase(), g.away); }
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}

function syncHTML(){
  if (!S.sync?.updated) return `<p class="sync"><span class="dot off"></span>No automatic score pull has run yet.</p>`;
  const d = new Date(S.sync.updated);
  const when = isNaN(d) ? "" : d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  return `<p class="sync"><span class="dot"></span>Scores pulled automatically${S.sync.source?` from ${esc(S.sync.source)}`:""}. Last pull: ${esc(when)}.${S.sync.note?` <span>${esc(S.sync.note)}</span>`:""}</p>`;
}

function resultsHTML(L, C){
  const form = S.canWrite ? `<form class="card form" id="gameForm" autocomplete="off">
      <div class="head-row"><h3>Add or correct a final</h3><span class="sub">A result you enter by hand replaces the automatic one for that game.</span></div>
      <div class="form-grid">
        <label class="f" for="gDate">Date<input type="date" id="gDate" required value="${todayISO()}"></label>
        <label class="f" for="gLg">League<select id="gLg"><option value="CFB">College</option><option value="NFL">NFL</option></select></label>
      </div>
      <div class="form-grid">
        <label class="f" for="gHome">Home team<input type="text" id="gHome" list="teamList" required></label>
        <label class="f" for="gHs">Home score<input type="number" id="gHs" min="0" inputmode="numeric" required></label>
        <label class="f" for="gAway">Away team<input type="text" id="gAway" list="teamList" required></label>
        <label class="f" for="gAs">Away score<input type="number" id="gAs" min="0" inputmode="numeric" required></label>
      </div>
      <datalist id="teamList">${teamOptions(C).map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
      <div class="btns"><button class="btn primary" type="submit">Save game</button><span class="msg" id="gMsg" role="status"></span></div>
    </form>` : `<p class="ro">You're viewing the league. Results come in automatically, and the commissioner can correct them.</p>`;

  const thisWeek = weekStart(todayISO());
  const missing = C.picks.filter(p=> !(C.rec[pk(p)]?.games||[]).some(g=>weekStart(g.date)===thisWeek));
  const pend = C.picks.length ? `<details class="card pend"><summary>${missing.length} drafted team${missing.length===1?"":"s"} with no result yet this week (${fmtShort(thisWeek)}–${fmtShort(weekEnd(thisWeek))})</summary>
      <div class="pend-list">${missing.map(p=>`<span class="pill">${esc(p.team)}</span>`).join("")||`<span class="sub">Every drafted team has a result.</span>`}</div></details>` : "";

  const shown = C.games.filter(g=> !S.onlyMine || C.owner[g.hk] || C.owner[g.ak]);
  const weeks = [...new Set(shown.map(g=>weekStart(g.date)))].sort().reverse();
  const visible = new Set(weeks.slice(0, S.weeksShown));
  const byDay = new Map();
  for (const g of shown) if (visible.has(weekStart(g.date))) (byDay.get(g.date) || byDay.set(g.date,[]).get(g.date)).push(g);
  const log = [...byDay.keys()].sort().reverse().map(date=>{
    const games = byDay.get(date);
    return `<div class="card day"><div class="day-h"><span>${fmtDay(date)}</span><span class="sub">${games.length} game${games.length===1?"":"s"}</span></div>${games.map(g=>{
      const hw = g.hs>g.as, aw = g.as>g.hs, ho=C.owner[g.hk], ao=C.owner[g.ak];
      const delId = [g.doc,g.lg,g.rawHome,g.rawAway].join("|");
      return `<div class="game">
        <div class="side ${aw?"won":""}"><span class="nm">${esc(g.away)}</span>${ao?`<span class="own">${esc(ao.owner)}</span>`:""}</div>
        <div class="score">${g.as} – ${g.hs} <span class="lg">${g.lg}</span>${g.rank===3?` <span class="tag">manual</span>`:""}</div>
        <div class="side right ${hw?"won":""}"><span class="nm">@ ${esc(g.home)}</span>${ho?`<span class="own">${esc(ho.owner)}</span>`:""}</div>
        ${S.canWrite?`<button class="x ${S.confirmDel===delId?"confirm":""}" data-del="${esc(delId)}" aria-label="Delete ${esc(g.away)} at ${esc(g.home)}">${S.confirmDel===delId?"Delete?":"✕"}</button>`:"<span></span>"}
      </div>`;}).join("")}</div>`;
  }).join("");
  const more = weeks.length>S.weeksShown ? `<div class="btns"><button class="btn" id="moreWeeks">Show earlier weeks</button><span class="sub">${weeks.length-S.weeksShown} more</span></div>` : "";

  return `<section class="panel">
    <div class="head-row"><h2>Results</h2>
      <div class="seg" role="group" aria-label="Which games to show"><button type="button" data-only="1" aria-pressed="${S.onlyMine}">This league's teams</button><button type="button" data-only="0" aria-pressed="${!S.onlyMine}">All games</button></div></div>
    ${syncHTML()}${form}${pend}
    ${log || `<div class="card empty"><strong>No games logged yet.</strong>Finals appear here after each automatic pull.</div>`}${more}
  </section>`;
}

/* ---------- draft ---------- */
function draftState(L){
  const owners = L.owners, N = owners.length, total = N*roundsOf(L);
  const ordered = (L.picks||[]).filter(p=>typeof p.n==="number").sort((a,b)=>a.n-b.n);
  const i = ordered.length, r = Math.floor(i/N), pos = i%N;
  const onClock = i<total ? ((L.draftType==="straight" || r%2===0) ? owners[pos] : owners[N-1-pos]) : null;
  return {owners,N,total,ordered,i,onClock,round:r+1,inRound:pos+1};
}
function needsFor(L, o){
  const have = {}; for (const p of (L.picks||[])) if (p.owner===o) have[p.pool]=(have[p.pool]||0)+1;
  const out = {}; for (const p of POOLS) out[p] = (slotsOf(L)[p]||0)-(have[p]||0);
  return out;
}
function draftHTML(L){
  const D = draftState(L), type = L.draftType==="straight"?"Straight":"Snake";
  if (L.status!=="drafting"){
    if (!D.i) return `<section class="panel"><div class="head-row"><h2>Draft</h2></div><div class="card empty"><strong>No draft on record.</strong></div></section>`;
    const rounds = Math.ceil(D.i/D.N);
    const rows = Array.from({length:rounds},(_,r)=> `<tr><td class="slot">Rd ${r+1}</td>${D.owners.map(o=>{
        const p = D.ordered.find(x=>x.owner===o && Math.ceil(x.n/D.N)===r+1);
        return p ? `<td><div class="cell"><span>${esc(p.team)}</span><span class="pkn">#${p.n} ${chip(p.pool)}</span></div></td>` : `<td></td>`;
      }).join("")}</tr>`).join("");
    return `<section class="panel">
      <div class="head-row"><h2>Draft Results</h2><p class="sub">${type} draft · ${D.N} managers · ${rounds} rounds · ${D.i} picks</p></div>
      <div class="card scroll"><table class="board rounds"><thead><tr><th>Round</th>${D.owners.map((o,i)=>`<th>${i+1}. ${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      ${S.canWrite?`<div class="btns"><button class="btn" id="reopen">Reopen the draft</button><span class="sub">Lets you undo or change the last picks.</span><span class="msg" id="dMsg" role="status"></span></div>`:""}
    </section>`;
  }
  const taken = new Set((L.picks||[]).map(pk));
  const need = D.onClock ? needsFor(L, D.onClock) : {};
  const q = S.draftQ.trim().toLowerCase();
  const list = POOLS.filter(p=>(S.draftPool==="all"||S.draftPool===p) && slotsOf(L)[p]).flatMap(p=>POOL[p].map(t=>({t,p})))
    .filter(x=>!taken.has(tk(x.t, x.p==="NFL"?"NFL":"CFB")) && (!q || x.t.toLowerCase().includes(q)));
  const avail = list.map(x=>`<button class="av" data-pick="${esc(x.t)}" data-pool="${esc(x.p)}" ${(!S.canWrite||!(need[x.p]>0))?"disabled":""}><span>${esc(x.t)}</span>${chip(x.p)}</button>`).join("");
  const needChips = POOLS.filter(p=>slotsOf(L)[p]).map(p=>`<span class="need ${need[p]>0?"":"done"}">${chip(p)}${need[p]>1?` <span class="num" style="font-size:12px">×${need[p]}</span>`:""}</span>`).join("");
  const feed = [...D.ordered].reverse().map(p=>`<div><span class="pk">${Math.ceil(p.n/D.N)}.${String(((p.n-1)%D.N)+1).padStart(2,"0")}</span>${chip(p.pool)}<span style="flex:1"><b>${esc(p.team)}</b></span><span class="sub">${esc(p.owner)}</span></div>`).join("");
  const order = D.owners.map((o,ix)=>`<span class="pill" style="${o===D.onClock?"border-color:var(--accent);font-weight:700":""}">${ix+1}. ${esc(o)}</span>`).join("");
  return `<section class="panel">
    <div class="head-row"><h2>Draft Room</h2><p class="sub">${type} draft · ${D.N} managers · ${roundsOf(L)} rounds · ${slotText(L)}</p></div>
    <div class="card clock"><div><div class="meta">On the clock · Round ${D.round}, pick ${D.inRound} · Overall ${D.i+1} of ${D.total}</div><div class="who">${esc(D.onClock||"Done")}</div><div class="needs">${needChips}</div></div>
      ${S.canWrite?`<div class="btns"><button class="btn danger" id="undoPick" ${D.i?"":"disabled"}>Undo last pick</button></div>`:""}</div>
    <div class="pend-list">${order}</div>
    <div class="two">
      <div class="card">
        <div class="form" style="padding-bottom:0">
          <div class="form-grid">
            <label class="f" for="dq">Search ${list.length} available teams<input type="text" id="dq" value="${esc(S.draftQ)}" placeholder="Type a team"></label>
            <label class="f" for="dp">Pool<select id="dp"><option value="all">All pools</option>${POOLS.filter(p=>slotsOf(L)[p]).map(p=>`<option ${S.draftPool===p?"selected":""}>${p}</option>`).join("")}</select></label>
          </div>
          ${S.canWrite?"":`<p class="ro">The commissioner enters each pick as it's called.</p>`}
          <span class="msg" id="dMsg" role="status"></span>
        </div>
        <div class="avail">${avail||`<span class="sub">No available teams match.</span>`}</div>
      </div>
      <div class="card feed"><div class="day-h"><span>Picks</span><span class="sub">${D.i} made</span></div>${feed||`<div class="sub">First pick is ${esc(D.onClock)}'s.</div>`}</div>
    </div>
  </section>`;
}

/* ---------- leagues ---------- */
function leaguesHTML(){
  const cards = S.leagues.map(l=>{
    const C = compute(l), lead = C.rows[0], D = draftState(l);
    const tied = lead ? C.rows.filter(r=>r.total===lead.total).length : 0;
    const st = l.status==="drafting" ? `<span class="status live">Drafting · pick ${Math.min(D.i+1,D.total)} of ${D.total}</span>` : `<span class="status">Season on</span>`;
    return `<div class="card lg-card ${l.id===S.leagueId?"cur":""}">
      ${st}<div class="nm">${esc(l.name)}</div>
      <div class="kv"><b>${seasonLabel(l.year)}</b> · ${l.owners.length} managers · ${l.draftType==="straight"?"straight":"snake"} draft</div>
      <div class="kv">${esc(slotText(l))}</div>
      <div class="kv">${lead&&lead.total ? `Leader: <b>${esc(lead.owner)}</b>${tied>1?` (tied with ${tied-1})`:""}, ${lead.total} wins` : "No wins on the board yet"}</div>
      <div class="btns"><button class="btn primary" data-open="${esc(l.id)}">Open</button>
      ${S.canWrite?`<button class="btn danger" data-dellg="${esc(l.id)}">${S.confirmLg===l.id?"Delete for everyone?":"Delete"}</button>`:""}</div>
    </div>`;
  }).join("");
  const cur = league();
  const mgrs = S.newMgrs.map((m,i)=>`<li><span class="ord">${i+1}</span><span class="who">${esc(m)}</span>
      <button type="button" class="ib" data-mv="${i}|-1" ${i?"":"disabled"} aria-label="Move ${esc(m)} up">↑</button>
      <button type="button" class="ib" data-mv="${i}|1" ${i<S.newMgrs.length-1?"":"disabled"} aria-label="Move ${esc(m)} down">↓</button>
      <button type="button" class="ib" data-rm="${i}" aria-label="Remove ${esc(m)}">✕</button></li>`).join("");
  const y = thisSeason();
  const form = S.canWrite ? `<form class="card form" id="lgForm" autocomplete="off">
      <div class="head-row"><h3>Create a league</h3><span class="sub">Every league drafts from all 32 NFL teams and all 138 FBS teams.</span></div>
      <div class="form-grid">
        <label class="f" for="lgName">League name<input type="text" id="lgName" required placeholder="Sunday Syndicate"></label>
        <label class="f" for="lgYear">Season<select id="lgYear">${[y,y+1].map(v=>`<option value="${v}">${seasonLabel(v)}</option>`).join("")}</select></label>
        <label class="f" for="lgType">Draft order<select id="lgType"><option value="snake">Snake (order reverses each round)</option><option value="straight">Straight (same order each round)</option></select></label>
      </div>
      <div><h3 style="margin-bottom:8px">Teams each manager drafts</h3>
        <div class="slot-grid">${POOLS.map(p=>`<label class="f" for="sl-${poolCls(p)}">${p}<input type="number" id="sl-${poolCls(p)}" min="0" max="10" value="${DEFAULT_SLOTS[p]}" inputmode="numeric"></label>`).join("")}</div></div>
      <div><h3 style="margin-bottom:8px">Managers, in draft order</h3>
        <ol class="mgr-list">${mgrs||`<li><span class="sub">Add each manager below. First on the list picks first.</span></li>`}</ol>
        <div class="btns" style="margin-top:8px">
          <input type="text" id="mgrName" placeholder="Manager name" style="max-width:220px" aria-label="Manager name">
          <button type="button" class="btn" id="mgrAdd">Add</button>
          <button type="button" class="btn" id="mgrShuffle" ${S.newMgrs.length>1?"":"disabled"}>Randomize order</button>
          ${cur?`<button type="button" class="btn" id="mgrCopy">Copy from ${esc(cur.name)}</button>`:""}
        </div></div>
      <div class="btns"><button class="btn primary" type="submit">Create league and open the draft</button><span class="msg" id="lgMsg" role="status"></span></div>
    </form>` : `<p class="ro">The commissioner creates leagues and runs each draft.</p>`;
  return `<section class="panel">
    <div class="head-row"><h2>Leagues</h2><p class="sub">${S.leagues.length} league${S.leagues.length===1?"":"s"} · scores are shared across all of them</p></div>
    ${cards?`<div class="lg-grid">${cards}</div>`:`<div class="card empty"><strong>No leagues yet.</strong>${S.canWrite?"Create the first one below.":"Leagues appear here once the commissioner creates one."}</div>`}
    ${form}
  </section>`;
}

/* ---------- events ---------- */
function setMsg(id, text, ok){ const m=$(id); if(m){ m.textContent=text; m.className="msg "+(ok?"ok":"err"); } }
function failText(e){ return e?.code==="invalid_argument" ? "You don't have permission to change league data." : e?.code==="quota_exceeded" ? "The league file is full." : "That didn't save. Check your connection and try again."; }

function bind(){
  document.querySelectorAll("tr.row").forEach(tr=>{
    const go = ()=>{ const o=tr.dataset.owner; S.open.has(o)?S.open.delete(o):S.open.add(o); render(); };
    tr.onclick = go; tr.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
  document.querySelectorAll("[data-only]").forEach(b=> b.onclick=()=>{ S.onlyMine = b.dataset.only==="1"; render(); });
  const mw=$("#moreWeeks"); if(mw) mw.onclick=()=>{ S.weeksShown+=3; render(); };
  const gf=$("#gameForm"); if(gf) gf.onsubmit=addGame;
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=> delGame(b.dataset.del));
  const dq=$("#dq"); if(dq) dq.oninput=()=>{ S.draftQ=dq.value; render(); };
  const dp=$("#dp"); if(dp) dp.onchange=()=>{ S.draftPool=dp.value; render(); };
  document.querySelectorAll("[data-pick]").forEach(b=> b.onclick=()=> makePick(b.dataset.pick, b.dataset.pool));
  const u=$("#undoPick"); if(u) u.onclick=undoPick;
  const ro=$("#reopen"); if(ro) ro.onclick=reopenDraft;
  document.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=> pickLeague(b.dataset.open, "standings"));
  document.querySelectorAll("[data-dellg]").forEach(b=> b.onclick=()=> delLeague(b.dataset.dellg));
  document.querySelectorAll("[data-mv]").forEach(b=> b.onclick=()=>{ const [i,d]=b.dataset.mv.split("|").map(Number), a=S.newMgrs; [a[i],a[i+d]]=[a[i+d],a[i]]; render(); });
  document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>{ S.newMgrs.splice(+b.dataset.rm,1); render(); });
  const addM = ()=>{ const el=$("#mgrName"), v=el.value.trim(); if(!v) return; if(S.newMgrs.some(m=>m.toLowerCase()===v.toLowerCase())) return setMsg("#lgMsg",`${v} is already on the list.`); S.newMgrs.push(v); S.reset.add("mgrName"); render(); $("#mgrName")?.focus(); };
  const ma=$("#mgrAdd"); if(ma) ma.onclick=addM;
  const mn=$("#mgrName"); if(mn) mn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addM(); } };
  const ms=$("#mgrShuffle"); if(ms) ms.onclick=()=>{ const a=S.newMgrs; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } render(); };
  const mc=$("#mgrCopy"); if(mc) mc.onclick=()=>{ S.newMgrs=[...(league()?.owners||[])]; render(); };
  const lf=$("#lgForm"); if(lf) lf.onsubmit=createLeague;
}

function pickLeague(id, tab){ S.leagueId=id; if(tab) S.tab=tab; S.open.clear(); S.weeksShown=2; try{ localStorage.setItem("pf-league",id); }catch(_){} render(); }

async function addGame(e){
  e.preventDefault();
  const date=$("#gDate").value, lg=$("#gLg").value, home=canonName($("#gHome").value,lg), away=canonName($("#gAway").value,lg);
  const hs=parseInt($("#gHs").value,10), as=parseInt($("#gAs").value,10);
  if(!date||!home||!away||isNaN(hs)||isNaN(as)) return setMsg("#gMsg","Fill in both teams, both scores and the date.");
  if(tk(home,lg)===tk(away,lg)) return setMsg("#gMsg","A team can't play itself.");
  const ref = S.db.doc(`games/${date}`);
  try{
    const snap = await ref.get();
    const games = snap.exists ? (snap.data().games||[]).filter(g=> !(g.lg===lg && tk(g.home,lg)===tk(home,lg) && tk(g.away,lg)===tk(away,lg))) : [];
    games.push({lg, home, away, hs, as});
    await ref.set({date, games});
    ["gHome","gHs","gAway","gAs"].forEach(id=>S.reset.add(id));
    render();
    setMsg("#gMsg",`Saved: ${away} ${as}, ${home} ${hs}. ${hs===as?"Tie":(hs>as?home:away)+" win"}.`,true);
    $("#gHome")?.focus();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}
async function delGame(id){
  if(S.confirmDel!==id){ S.confirmDel=id; return render(); }
  S.confirmDel=null;
  const [docId,lg,home,away]=id.split("|");
  const ref=S.db.doc(`games/${docId}`);
  try{
    const snap=await ref.get(); if(!snap.exists) return render();
    const d=snap.data(), games=(d.games||[]).filter(g=> !((g.lg==="NFL"?"NFL":"CFB")===lg && g.home===home && g.away===away));
    if(games.length || d.src==="auto") await ref.set({...d, games}); else await ref.delete();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}

async function makePick(team, pool){
  const L=league(), D=draftState(L); if(!D.onClock) return;
  const lg = pool==="NFL"?"NFL":"CFB";
  if ((L.picks||[]).some(p=>pk(p)===tk(team,lg))) return setMsg("#dMsg",`${team} is already drafted.`);
  const need = needsFor(L, D.onClock);
  if (!(need[pool]>0)) return setMsg("#dMsg",`${D.onClock} has no ${pool} slot left.`);
  const many = slotsOf(L)[pool]>1, have = (L.picks||[]).filter(p=>p.owner===D.onClock&&p.pool===pool).length;
  const picks = [...(L.picks||[]), {n:D.i+1, owner:D.onClock, team, pool, slot: many?`${pool} #${have+1}`:pool}];
  try{ await S.db.doc(`leagues/${L.id}`).update({picks, status: picks.length>=D.total?"complete":"drafting"}); S.draftQ=""; S.reset.add("dq"); render(); }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function undoPick(){
  const L=league(), D=draftState(L); if(!D.i) return;
  const last=D.ordered[D.ordered.length-1];
  try{ await S.db.doc(`leagues/${L.id}`).update({picks:(L.picks||[]).filter(p=>p!==last && p.n!==last.n), status:"drafting"}); }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function reopenDraft(){
  try{ await S.db.doc(`leagues/${league().id}`).update({status:"drafting"}); }catch(err){ setMsg("#dMsg",failText(err)); }
}
async function createLeague(e){
  e.preventDefault();
  const name=$("#lgName").value.trim(), year=+$("#lgYear").value, draftType=$("#lgType").value, owners=[...S.newMgrs];
  const slots={}; for(const p of POOLS) slots[p]=Math.max(0,Math.min(10,parseInt($("#sl-"+poolCls(p)).value,10)||0));
  if(!name) return setMsg("#lgMsg","Name the league.");
  if(owners.length<2) return setMsg("#lgMsg","Add at least two managers.");
  if(!POOLS.some(p=>slots[p])) return setMsg("#lgMsg","Each manager needs at least one team.");
  for(const p of POOLS) if(owners.length*slots[p]>POOL[p].length) return setMsg("#lgMsg",`${owners.length} managers × ${slots[p]} ${p} teams is more than the ${POOL[p].length} ${p} teams available.`);
  let id=(name+"-"+year).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"league";
  if(S.leagues.some(l=>l.id===id)) id+="-"+Math.random().toString(36).slice(2,6);
  try{
    await S.db.doc(`leagues/${id}`).set({name, year, owners, slots, draftType, status:"drafting", picks:[], created:new Date().toISOString()});
    S.newMgrs=[]; S.reset.add("lgName"); pickLeague(id,"draft");
  }catch(err){ setMsg("#lgMsg",failText(err)); }
}
async function delLeague(id){
  if(S.confirmLg!==id){ S.confirmLg=id; return render(); }
  S.confirmLg=null;
  try{ await S.db.doc(`leagues/${id}`).delete(); }catch(err){ setMsg("#lgMsg",failText(err)); }
}

/* ---------- boot ---------- */
document.querySelectorAll(".tab").forEach(b=> b.onclick=()=>{ S.tab=b.dataset.tab; S.confirmDel=S.confirmLg=null; try{ localStorage.setItem("pf-tab",S.tab); }catch(_){} render(); });
$("#leagueSel").onchange=e=> pickLeague(e.target.value, S.tab==="leagues"?"standings":null);
const TABS=["standings","board","results","draft","leagues"];
try{ const t=localStorage.getItem("pf-tab"); if(TABS.includes(t)) S.tab=t; S.leagueId=localStorage.getItem("pf-league"); }catch(_){}
if (TABS.includes(location.hash.slice(1))) S.tab=location.hash.slice(1);

(async function boot(){
  const db = await (window.claude?.use ? window.claude.use("db") : null);
  S.db = db;
  if(!db){ render(); return; }
  const user = await window.claude.use("user");
  S.canWrite = (user ? await user.can("data.write") : null) !== false;
  db.collection("leagues").limit(200).onSnapshot(q=>{
    S.leagues = q.docs.map(d=>({id:d.id, ...d.data()})).filter(l=>l.name && Array.isArray(l.owners)).sort((a,b)=> (a.created||"")<(b.created||"")?-1:1);
    S.leaguesLoaded = true;
    if(!S.leagues.some(l=>l.id===S.leagueId)) S.leagueId = S.leagues[0]?.id || null;
    render();
  }, ()=>{});
  db.collection("games").limit(1000).onSnapshot(q=>{ S.gameDocs = q.docs.map(d=>({_id:d.id, ...d.data()})); render(); }, ()=>{});
  db.doc("meta/sync").onSnapshot(s=>{ S.sync = s.exists ? s.data() : null; render(); }, ()=>{});
})();
</script>

</body>
</html>
