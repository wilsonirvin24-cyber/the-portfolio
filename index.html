<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Portfolio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Portfolio">
<meta name="theme-color" content="#0f2a1e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.pubnote{max-width:1080px;margin:0 auto;padding:0 16px 28px;font-size:12.5px;color:var(--muted)}</style>
<script src="vendor/supabase.js"></script>
<script src="backend.js"></script>
</head>
<body>
<title>The Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a trading-floor ledger. Wordmark + live ticker on top, tabbed desk below; tables carry the page. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1; --fg:#14201a; --muted:#5d6b62;
  --accent:#0d6a45; --accent-ink:#ffffff; --accent-soft:#dcefe4;
  --up:#0d7a4b; --down:#b4362b; --gold:#a07612;
  --ticker-bg:#0f2a1e; --ticker-fg:#d9efe2;
  --nfl:#1f4e9c; --acc:#c25412; --b10:#2d6fb8; --b12:#b8292f; --sec:#7a3fa5; --np4:#4f7a2a; --be:#0e7f86;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c; --be:#5fcfd6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c; --be:#5fcfd6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* masthead */
header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
#signBtn{white-space:nowrap;padding:7px 12px;font-size:14px}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.season-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.season-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg)}

/* ticker */
.ticker{background:var(--ticker-bg);color:var(--ticker-fg);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:12.5px;border-block:1px solid var(--line)}
.ticker-track{display:inline-flex;gap:28px;padding:8px 0;animation:tick 60s linear infinite;padding-left:16px}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk b{font-weight:600;color:#fff}
.tk .w{color:#5fe0a0}.tk .l{color:#ff8f84}.tk .o{opacity:.65}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker{overflow-x:auto}.ticker-track{animation:none}}
:root[data-theme="light"] .tk b{color:#fff}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:12px 14px 10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:20px 60px}
section.panel{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:0}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto;min-width:0}

/* standings */
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.st td{border-bottom:1px solid var(--line)}
.st tr.row{cursor:pointer}
.st tr.row:hover td{background:var(--sunk)}
.st tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.r{text-align:right}
.rk{width:34px;color:var(--muted)}
.mgr{font-weight:600}
.tot{font-size:20px;font-weight:600}
.lead .rk{color:var(--gold);font-weight:700}
.chev{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
tr.open .chev{transform:rotate(90deg)}
.delta.up{color:var(--up)}.delta.zero{color:var(--muted)}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:5px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--accent)}
.detail td{background:var(--sunk);padding:12px 12px 14px}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px}
.h-item{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 0}
.h-item .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-item .rec{font-family:var(--mono);font-size:13px}

.chip{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.p-NFL{--c:var(--nfl)}.p-ACC{--c:var(--acc)}.p-Big-Ten{--c:var(--b10)}.p-Big-12{--c:var(--b12)}.p-SEC{--c:var(--sec)}.p-Non-P4{--c:var(--np4)}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ld{padding:12px;display:flex;flex-direction:column;gap:4px}
.ld .t{font-weight:600}
.ld .o{font-size:12.5px;color:var(--muted)}
.ld .n{font-family:var(--mono);font-size:22px;font-weight:600}

/* board */
.board th,.board td{border:1px solid var(--line);font-size:13px;vertical-align:top}
.board thead th{background:var(--surface);position:sticky;top:0}
.board td{min-width:118px;background:var(--surface)}
.board td.slot{min-width:84px;background:var(--sunk);font-weight:600}
.cell{display:flex;flex-direction:column;gap:2px}
.cell .rec{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell.hot{box-shadow:inset 3px 0 0 var(--up)}
.cell.cold{box-shadow:inset 3px 0 0 var(--down)}
.board td.tot-row{font-family:var(--mono);font-weight:600;background:var(--sunk)}

/* forms */
.form{padding:16px;display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--down)}.msg.ok{color:var(--up)}

/* results log */
.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.game{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.game:last-child{border-bottom:0}
.side{display:flex;flex-direction:column;min-width:0}
.side.right{text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.won .nm{font-weight:700}
.side .own{font-size:11.5px;color:var(--accent);font-weight:600}
.score{font-family:var(--mono);font-weight:600;white-space:nowrap}
.lg{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:13px}
.x:hover{color:var(--down)}
.x.confirm{color:var(--accent-ink);background:var(--down)}
details.pend{padding:12px 14px}
details.pend summary{cursor:pointer;font-weight:600;font-size:14px}
.pend-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}

/* draft */
.clock{padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-color:var(--accent)}
.clock .who{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.clock .meta{color:var(--muted);font-size:13px}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.need.done{opacity:.35;text-decoration:line-through}
.avail{max-height:560px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:12px}
.av{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.av:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.av:disabled{opacity:.35;cursor:not-allowed}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.feed .pk{font-family:var(--mono);color:var(--muted);width:46px}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.clock{grid-template-columns:1fr}}

.empty{padding:32px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.ro{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

@media (max-width:520px){
  th,td{padding:9px 5px}
  .hide-sm{display:none}
  .tot{font-size:18px}
  .game{grid-template-columns:1fr auto 1fr;}
  .game .x{grid-column:1/-1;justify-self:end}
}

/* leagues */
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lg-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.lg-card.cur{border-color:var(--accent)}
.lg-card .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.lg-card .kv{font-size:13px;color:var(--muted)}
.lg-card .kv b{color:var(--fg);font-weight:600}
.status{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:var(--accent);border-color:var(--accent)}
.mgr-list{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.mgr-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mgr-list .ord{font-family:var(--mono);color:var(--muted);width:24px}
.mgr-list .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;width:30px;height:30px;cursor:pointer;line-height:1}
.ib:hover:not(:disabled){border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.dot.off{background:var(--muted)}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:uppercase}
.rounds td{min-width:112px}
.rounds .pkn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.league-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.league-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);max-width:240px}

/* front page */
.brand h1 a{color:inherit;text-decoration:none}
.brand h1 a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hero{display:grid;gap:14px;padding-block:6px 2px}
.hero h2{font-size:clamp(42px,10vw,84px);font-weight:900;line-height:.9;letter-spacing:.005em}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{font-size:17px;line-height:1.5;max-width:60ch;margin:0}
.facts{display:flex;gap:6px 20px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.steps li{padding:16px;display:flex;flex-direction:column;gap:6px}
.steps .n{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;color:var(--accent)}
.steps li h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg)}
.steps li p{margin:0;font-size:14px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.share{display:flex;gap:6px;align-items:stretch}
.share input[type=text]{font-family:var(--mono);font-size:11.5px;padding:6px 8px;color:var(--muted)}
.share .btn{padding:6px 10px;font-size:12.5px;white-space:nowrap}

/* v5: app shell */
.p-NBA{--c:var(--nfl)}.p-Big-East{--c:var(--be)}.p-Other{--c:var(--np4)}.p-Any{--c:var(--muted)}
.topbar{display:flex;align-items:center;gap:8px}
.gear{appearance:none;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:6px;width:36px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.gear:hover{border-color:var(--muted)}
.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sports{display:flex;gap:6px;flex-wrap:wrap}
.sports button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.sports button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sports button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pf{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pf:hover{border-color:var(--accent)}
.pf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pf .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.pf .big{display:flex;align-items:baseline;gap:8px}
.pf .big .bn{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.pf .kv{font-size:13px;color:var(--muted)}
.pf .kv b{color:var(--fg);font-weight:600}
.sport-tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.claim{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.claim select{width:auto;padding:6px 8px}
.me-head{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.me-head .who{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,40px);text-transform:uppercase;line-height:1}
.me-head .n{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;text-align:right}
.me-head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:right}
.team td{border-bottom:1px solid var(--line)}
.team tr:last-child td{border-bottom:0}
.set{padding:16px;display:flex;flex-direction:column;gap:10px}
.set p{margin:0;font-size:14px;max-width:68ch}
.set details{border-top:1px solid var(--line);padding-top:8px}
.set summary{cursor:pointer;font-weight:600}
.set details p{margin-top:6px;color:var(--muted)}
details.how>summary{cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:20px}
details.how[open]>summary{margin-bottom:14px}
.auth{max-width:460px;margin:0 auto;width:100%}
.auth .form{gap:14px}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
/* ---------- team pools ---------- */

ntana","Montana State","Morehead State","Morgan State","Mount St. Mary's","Murray State","NJIT","Navy","Nevada","New Hampshire","New Haven","New Mexico","New Mexico State","New Orleans","Niagara","Nicholls","Norfolk State","North Alabama","North Carolina A&T","North Carolina Central","North Dakota","North Dakota State","North Florida","North Texas","Northeastern","Northern Arizona","Northern Colorado","Northern Illinois","Northern Iowa","Northern Kentucky","Northwestern State","Oakland","Ohio","Old Dominion","Omaha","Oral Roberts","Oregon State","Pacific","Penn","Pepperdine","Portland","Portland State","Prairie View A&M","Presbyterian","Princeton","Purdue Fort Wayne","Queens","Quinnipiac","Radford","Rhode Island","Rice","Richmond","Rider","Robert Morris","SIU Edwardsville","Sacramento State","Sacred Heart","Saint Joseph's","Saint Louis","Saint Mary's","Saint Peter's","Sam Houston","Samford","San Diego","San Diego State","San Francisco","San Jose State","Santa Clara","Seattle","Siena","South Alabama","South Carolina State","South Dakota","South Dakota State","South Florida","Southeast Missouri State","Southeastern Louisiana","Southern","Southern Illinois","Southern Indiana","Southern Miss","Southern Utah","St. Bonaventure","St. Thomas","Stephen F. Austin","Stetson","Stonehill","Stony Brook","Tarleton State","Temple","Tennessee State","Tennessee Tech","Texas A&M-Corpus Christi","Texas Southern","Texas State","The Citadel","Toledo","Towson","Troy","Tulane","Tulsa","UAB","UC Davis","UC Irvine","UC Riverside","UC San Diego","UC Santa Barbara","UIC","UMBC","UMass","UMass Lowell","UNC Asheville","UNC Greensboro","UNC Wilmington","UNLV","USC Upstate","UT Arlington","UT Martin","UTEP","UTRGV","UTSA","Utah State","Utah Tech","Utah Valley","VCU","VMI","Valparaiso","Vermont","Wagner","Washington State","Weber State","West Florida","West Georgia","Western Carolina","Western Illinois","Western Kentucky","Western Michigan","Wichita State","William & Mary","Winthrop","Wofford","Wright State","Wyoming","Yale","Youngstown State"]};

const SPORTS = {
  football:   { label:"Football",   pro:"NFL", col:"CFB", pools:["NFL","ACC","Big Ten","Big 12","SEC","Non-P4"], teams:FB_POOL,
                slots:{"NFL":3,"ACC":1,"Big Ten":1,"Big 12":1,"SEC":1,"Non-P4":1}, flex:0, weights:{},
                counts:"NFL regular season, plus the full college season including bowls and the playoff." },
  basketball: { label:"Basketball", pro:"NBA", col:"CBB", pools:["NBA","SEC","Big Ten","Big 12","ACC","Big East","Other"], teams:BB_POOL,
                slots:{"NBA":3,"SEC":1,"Big Ten":1,"Big 12":1,"ACC":1,"Big East":1,"Other":4}, flex:0, weights:{"NBA":0.5},
                counts:"NBA regular season at half a win each, plus every college game including March Madness." }
};
const SPORT_KEYS = Object.keys(SPORTS);
const PFX = {NFL:"n:", CFB:"c:", NBA:"b:", CBB:"m:"};
/* Spellings other score sources use, mapped to the names above. */
const ALIAS = {"miami (fla.)":"Miami","miami (fl)":"Miami","miami fl":"Miami","miami-fl":"Miami","miami (oh)":"Miami (OH)","miami-oh":"Miami (OH)","miami (ohio)":"Miami (OH)","miami oh":"Miami (OH)","miami ohio":"Miami (OH)","miss. state":"Mississippi State","ga. southern":"Georgia Southern","ga. tech":"Georgia Tech","va. tech":"Virginia Tech","ul-monroe":"Louisiana-Monroe","ul monroe":"Louisiana-Monroe","ulm":"Louisiana-Monroe","louisiana monroe":"Louisiana-Monroe","louisiana-lafayette":"Louisiana","ul-lafayette":"Louisiana","c. michigan":"Central Michigan","cent. michigan":"Central Michigan","e. michigan":"Eastern Michigan","w. michigan":"Western Michigan","n. illinois":"Northern Illinois","niu":"Northern Illinois","app. state":"Appalachian State","app state":"Appalachian State","so. miss":"Southern Miss","southern mississippi":"Southern Miss","southern miss.":"Southern Miss","w. kentucky":"Western Kentucky","wku":"Western Kentucky","middle tenn.":"Middle Tennessee","middle tennessee state":"Middle Tennessee","mtsu":"Middle Tennessee","fau":"Florida Atlantic","florida international":"FIU","c. carolina":"Coastal Carolina","pitt":"Pittsburgh","n.c. state":"NC State","north carolina state":"NC State","massachusetts":"UMass","connecticut":"UConn","southern methodist":"SMU","central florida":"UCF","brigham young":"BYU","mississippi":"Ole Miss","texas christian":"TCU","louisiana state":"LSU","southern california":"USC","hawai'i":"Hawaii","san josé state":"San Jose State","la. tech":"Louisiana Tech","la tech":"Louisiana Tech","sam houston state":"Sam Houston","ut san antonio":"UTSA","texas-san antonio":"UTSA","texas-el paso":"UTEP","alabama-birmingham":"UAB","army west point":"Army","n. texas":"North Texas","s. florida":"South Florida","usf":"South Florida","e. carolina":"East Carolina","ecu":"East Carolina","s. carolina":"South Carolina","n. carolina":"North Carolina","unc":"North Carolina","w. virginia":"West Virginia","boston col.":"Boston College","ndsu":"North Dakota State","n. dakota state":"North Dakota State","s. alabama":"South Alabama","cal":"California","jax state":"Jacksonville State","nevada-las vegas":"UNLV","bowling green state":"Bowling Green",
  "saint john's":"St. John's","st. john's (ny)":"St. John's","uncw":"UNC Wilmington","uncg":"UNC Greensboro","etsu":"East Tennessee State","fgcu":"Florida Gulf Coast","siue":"SIU Edwardsville","semo":"Southeast Missouri State","loyola (chi)":"Loyola Chicago","loyola-chicago":"Loyola Chicago","loyola (md)":"Loyola Maryland","st. mary's":"Saint Mary's","saint mary's (ca)":"Saint Mary's","st. joseph's":"Saint Joseph's","st. peter's":"Saint Peter's","st. louis":"Saint Louis","iupui":"IU Indy","umkc":"Kansas City","citadel":"The Citadel","grambling":"Grambling State","southern university":"Southern","pennsylvania":"Penn","long island university":"LIU","texas a&m-cc":"Texas A&M-Corpus Christi","ut rio grande valley":"UTRGV","sf austin":"Stephen F. Austin","california baptist":"Cal Baptist","csu bakersfield":"Cal State Bakersfield","detroit":"Detroit Mercy","college of charleston":"Charleston"};

const S = { db:null, canWrite:false, leagues:[], leaguesLoaded:false, leagueId:null, gameDocs:[], sync:null,
  view:"home", tab:"standings", wantLeague:null, wantTab:null, open:new Set(), onlyMine:true, weeksShown:2, draftPool:"all", draftQ:"",
  confirmDel:null, confirmLg:null, newMgrs:[], newSport:"football", sportFilter:"all", me:{}, theme:"system", reset:new Set(),
  auth:{user:null, profile:null, live:true}, authMode:"in", authNote:"", join:null, invites:{} };

/* Accounts exist on the website (window.portfolioAuth). Inside Claude there are none, and the owner manages everything. */
const A = window.portfolioAuth || null;
const meId = () => A && S.auth.user ? S.auth.user.id : null;
const canCreate = () => A ? !!meId() && S.auth.live : S.canWrite;
const canAdmin = L => A ? !!meId() && S.auth.live && (L.commissioner===meId() || !!(S.auth.profile && S.auth.profile.is_admin)) : S.canWrite;
const canEditGames = () => !A && S.canWrite;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const poolCls = p => "p-" + String(p).replace(/\s+/g,"-");
const chip = p => `<span class="chip ${poolCls(p)}">${esc(p==="Big Ten"?"B1G":p==="Big 12"?"B12":p)}</span>`;
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const ordinal = n => n + (n%100>=11&&n%100<=13 ? "th" : ["th","st","nd","rd"][n%10] || "th");

/* ---------- team names ---------- */
const NAMES = {NFL:new Map(), NBA:new Map(), CFB:new Map(), CBB:new Map()};
for (const k of SPORT_KEYS){ const sp = SPORTS[k]; for (const p of sp.pools) for (const t of sp.teams[p]) NAMES[p===sp.pro ? sp.pro : sp.col].set(t.toLowerCase(), t); }
const normLg = lg => PFX[lg] ? lg : "CFB";
function canonName(name, lg){
  const s = String(name||"").trim().replace(/\s+/g," ");
  const low = s.toLowerCase().replace(/[’`ʻ]/g,"'");
  const m = NAMES[lg] || NAMES.CFB;
  if (lg==="NFL" || lg==="NBA"){ if (m.has(low)) return m.get(low); const w = low.split(" "); return m.get(w.slice(-2).join(" ")) || m.get(w[w.length-1]) || s; }
  if (ALIAS[low] && m.has(ALIAS[low].toLowerCase())) return ALIAS[low];
  if (m.has(low)) return m.get(low);
  const st = low.replace(/\bst\.?$/,"state");
  if (ALIAS[st] && m.has(ALIAS[st].toLowerCase())) return ALIAS[st];
  if (m.has(st)) return m.get(st);
  if (ALIAS[low]) return ALIAS[low];
  return st!==low ? s.replace(/\bSt\.?$/i,"State") : s;
}
const tk = (name, lg) => PFX[lg] + canonName(name, lg).toLowerCase();

/* ---------- dates: league week runs Tuesday through Monday ---------- */
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const weekStart = s => { const d = toD(s); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+5)%7)); return iso(d); };
const weekEnd = ws => iso(new Date(toD(ws).getTime()+6*864e5));
const fmtDay = s => toD(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const fmtShort = s => toD(s).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const todayISO = () => { const n = new Date(); return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))); };
const seasonLabel = y => `${y}–${String(y+1).slice(2)}`;
const thisSeason = () => { const n = new Date(); return n.getMonth()>=2 ? n.getFullYear() : n.getFullYear()-1; };

/* ---------- league helpers ---------- */
const league = () => S.leagues.find(l=>l.id===S.leagueId) || null;
const sportOf = L => SPORTS[L.sport] ? L.sport : "football";
const SP = L => SPORTS[sportOf(L)];
const slotsOf = L => L.slots || SP(L).slots;
const flexOf = L => typeof L.flex==="number" ? L.flex : (L.slots ? 0 : SP(L).flex);
const weightOf = (L, pool) => { const w = (L.weights || SP(L).weights || {})[pool]; return typeof w==="number" ? w : 1; };
const lgOfPool = (L, pool) => pool===SP(L).pro ? SP(L).pro : SP(L).col;
const pk = (L, p) => tk(p.team, lgOfPool(L, p.pool));
const roundsOf = L => SP(L).pools.reduce((n,p)=> n + (slotsOf(L)[p]||0), 0) + flexOf(L);
function slotRows(L){
  const out=[];
  for (const p of SP(L).pools){ const n=slotsOf(L)[p]||0; for (let i=1;i<=n;i++) out.push({slot: n>1?`${p} #${i}`:p, pool:p, ix:i, many:n>1}); }
  const f = flexOf(L); for (let i=1;i<=f;i++) out.push({slot: f>1?`Any #${i}`:"Any", pool:"Any", ix:i, many:f>1});
  return out;
}
const slotText = L => SP(L).pools.filter(p=>slotsOf(L)[p]).map(p=>`${slotsOf(L)[p]} ${p==="Other"?"other-conference":p}`).concat(flexOf(L)?[`${flexOf(L)} any college`]:[]).join(" · ");
const weightText = L => SP(L).pools.filter(p=>weightOf(L,p)!==1).map(p=>`${p} wins count ${weightOf(L,p)}`).join(" · ");
const mine = L => {
  if (A){ const id = meId(), m = L.members || {}; return id ? (L.owners.find(o=>m[o]===id) || null) : null; }
  const o = S.me[L.id]; return o && L.owners.includes(o) ? o : null;
};

/* ---------- games: one list for every league, de-duplicated ---------- */
let _games = null;
function allGames(){
  if (_games) return _games;
  const seen = new Map();
  for (const d of S.gameDocs) (d.games||[]).forEach(g=>{
    const lg = normLg(g.lg || d.lg), date = g.date||d.date, hs=+g.hs, as=+g.as;
    if (!/^\d{4}-\d\d-\d\d$/.test(date||"") || !isFinite(hs) || !isFinite(as) || !g.home || !g.away) return;
    const G = {doc:d._id, lg, date, home:canonName(g.home,lg), away:canonName(g.away,lg), rawHome:g.home, rawAway:g.away, rawLg:g.lg, hs, as, rank:({auto:1,sheet:2})[g.src||d.src]||3};
    const a = tk(G.home,lg), b = tk(G.away,lg);
    G.hk=a; G.ak=b;
    // basketball teams can meet twice in a week, so those games are keyed by day; football by week
    const span = (lg==="NBA"||lg==="CBB") ? date : weekStart(date);
    const k = span+"|"+(a<b?a+"|"+b:b+"|"+a);
    const prev = seen.get(k);
    if (!prev || G.rank>prev.rank) seen.set(k, G);   // a hand-entered result outranks an automatic one
  });
  return _games = [...seen.values()].sort((x,y)=> x.date<y.date?-1:x.date>y.date?1:0);
}
const winnerKey = g => g.hs===g.as ? null : (g.hs>g.as ? g.hk : g.ak);

function compute(L){
  const sp = SP(L), y = L.year || thisSeason();
  const lo = `${y}-07-01`, hi = `${y+1}-06-30`;
  const games = allGames().filter(g=> g.date>=lo && g.date<=hi && (g.lg===sp.pro || g.lg===sp.col));
  const rec = {}; const R = k => rec[k] || (rec[k] = {w:0,l:0,t:0,games:[]});
  for (const g of games){
    if (g.hs===g.as){ R(g.hk).t++; R(g.ak).t++; }
    else if (g.hs>g.as){ R(g.hk).w++; R(g.ak).l++; }
    else { R(g.ak).w++; R(g.hk).l++; }
    R(g.hk).games.push(g); R(g.ak).games.push(g);
  }
  const lastDate = games.length ? games[games.length-1].date : null;
  const curWeek = lastDate ? weekStart(lastDate) : null;
  const firstWeek = games.length ? weekStart(games[0].date) : null;
  const weekNo = curWeek ? Math.round((toD(curWeek)-toD(firstWeek))/(7*864e5))+1 : 0;
  const picks = L.picks || [], owner = {};
  for (const p of picks) owner[pk(L,p)] = p;
  const order = slotRows(L).map(s=>s.slot);
  const rows = (L.owners||[]).map(o=>{
    let pro=0, col=0, total=0, wk=0;
    const holdings = picks.filter(p=>p.owner===o).map(p=>{
      const k = pk(L,p), r = rec[k] || {w:0,l:0,t:0,games:[]}, wt = weightOf(L,p.pool);
      if (p.pool===sp.pro) pro+=r.w; else col+=r.w;
      total += r.w*wt;
      const wkG = r.games.filter(g=>weekStart(g.date)===curWeek);
      wk += wkG.filter(g=>winnerKey(g)===k).length*wt;
      return {...p, k, w:r.w, l:r.l, t:r.t, pts:r.w*wt, wt, wkG};
    }).sort((a,b)=> order.indexOf(a.slot)-order.indexOf(b.slot));
    return {owner:o, pro, col, total, wk, holdings};
  });
  rows.sort((a,b)=> b.total-a.total || b.pro-a.pro || a.owner.localeCompare(b.owner));
  let rank = 0;
  rows.forEach((r,i)=>{ if (i===0 || r.total!==rows[i-1].total) rank=i+1; r.rank=rank; });
  const top = rows[0]?.total || 0; rows.forEach(r=> r.gb = top-r.total);
  return {games, rec, owner, rows, curWeek, weekNo, lastDate, picks, sp};
}

/* ---------- routing: #home, #settings, #<league>, #<league>.<tab> ---------- */
const PUBLIC_BASE = window.PORTFOLIO_PUBLIC ? location.origin + location.pathname : "https://wilsonirvin24-cyber.github.io/the-portfolio/";
const leagueURL = id => PUBLIC_BASE + "#" + id;
const TABS = ["team","standings","board","results","draft"];
function applyHash(){
  const h = (location.hash||"").slice(1);
  if (!h || h==="home"){ S.view = "home"; return; }
  if (h==="settings"){ S.view = "settings"; return; }
  if (h==="signin"){ S.view = "auth"; return; }
  if (/access_token=|error=|type=recovery/.test(h)){ S.view = "home"; return; }   // a sign-in link from an email; the account code reads it
  if (h.startsWith("join.")){ const [, jid, code] = h.split("."); S.join = {id:jid, code:code||""}; S.view = "join"; return; }
  const [lid, tab] = h.split(".");
  S.view = "league"; S.wantLeague = lid; S.wantTab = TABS.includes(tab) ? tab : null;
}
function settleLeague(){
  if (S.wantLeague && S.leaguesLoaded){
    const L = S.leagues.find(l=>l.id===S.wantLeague);
    if (L){ S.leagueId = L.id; S.tab = S.wantTab || (mine(L) ? "team" : "standings"); } else S.view = "home";
    S.wantLeague = S.wantTab = null;
  }
  if (!S.leagues.some(l=>l.id===S.leagueId)) S.leagueId = (S.leagues.find(l=>mine(l)) || S.leagues[0])?.id || null;
}
function syncHash(){
  const L = league();
  const want = S.view==="settings" ? "settings" : S.view==="auth" ? "signin" : (S.view==="join" && S.join) ? `join.${S.join.id}.${S.join.code}` : (S.view==="league" && L) ? L.id + "." + S.tab : "";
  const have = (location.hash||"").slice(1);
  if (have===want || (want==="" && have==="home")) return;
  if (/access_token=|error=|type=recovery/.test(have)) return;
  try{ history.replaceState(null, "", want ? "#"+want : location.pathname + location.search); }catch(_){}
}
function go(view, id, tab){
  S.view = view; S.confirmDel = S.confirmLg = null;
  if (view==="league"){
    if (id && id!==S.leagueId){ S.leagueId = id; S.open.clear(); S.weeksShown = 2; S.draftQ = ""; S.draftPool = "all"; }
    const L = league(); S.tab = tab || (L && mine(L) ? "team" : "standings");
  }
  render(); try{ window.scrollTo(0,0); }catch(_){}
}

function applyTheme(){

/* ---------- rendering ---------- */
function render(){
  _games = null;
  const main = $("#main");
  const keep = {}; main.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=> keep[e.id]=e.value);
  const ae = document.activeElement, fid = ae && main.contains(ae) ? ae.id : null;
  let sel = null; try{ if (fid && ae.selectionStart!=null) sel=[ae.selectionStart, ae.selectionEnd]; }catch(_){}

  const L = league();
  const view = S.view==="league" && !L ? "home" : S.view;
  $("#tabsNav").hidden = view!=="league";
  $("#signBtn").hidden = !(A && S.auth.live && !meId()) || view==="auth";
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", String(view==="league" && b.dataset.tab===S.tab)));
  renderLeagueSel(view);
  if (S.db===null) main.innerHTML = `<section class="card empty"><strong>League data isn't available here.</strong>Open this page in Claude while signed in to see your leagues.</section>`;
  else if (!S.leaguesLoaded) main.innerHTML = `<section class="card empty"><strong>Opening The Portfolio…</strong>Your leagues, standings and results load from the shared league file.</section>`;
  else if (view==="settings"){ $("#tagline").textContent = "Settings"; renderTickerAll(); main.innerHTML = settingsHTML(); }
  else if (view==="auth"){ $("#tagline").textContent = "Your account"; renderTickerAll(); main.innerHTML = authHTML(); }
  else if (view==="join"){ $("#tagline").textContent = "Join a league"; renderTickerAll(); main.innerHTML = joinHTML(); }
  else if (view==="home"){ $("#tagline").textContent = "Draft teams, not players. Most wins takes the table."; renderTickerAll(); main.innerHTML = homeHTML(); }
  else {
    const C = compute(L);
    renderTicker(L, C);
    $("#tagline").textContent = `${L.name} · ${SP(L).label} ${seasonLabel(L.year)} · ${L.owners.length} managers`;
    main.innerHTML = {team:teamHTML, standings:standingsHTML, board:boardHTML, results:resultsHTML, draft:draftHTML}[S.tab](L, C);
  }
  for (const id in keep){ if (S.reset.has(id)) continue; const el = document.getElementById(id); if (el && el.value!==keep[id]) el.value = keep[id]; }
  S.reset.clear();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); if (sel) try{ el.setSelectionRange(sel[0],sel[1]); }catch(_){} } }
  bind();
  if (S.leaguesLoaded) syncHash();
}

function renderLeagueSel(view){
  const sel = $("#leagueSel");
  const opt = l => `<option value="${esc(l.id)}" ${view==="league"&&l.id===S.leagueId?"selected":""}>${esc(l.name)} · ${SP(l).label} ${seasonLabel(l.year)}</option>`;
  const my = S.leagues.filter(l=>mine(l)), rest = S.leagues.filter(l=>!mine(l));

    + (rest.length ? `<optgroup label="${my.length?"Other leagues":"Leagues"}">${rest.map(opt).join("")}</optgroup>` : "");
}

/* The ticker: latest finals for drafted teams. label(key) returns the manager to show, "" for none, or null when the team is not drafted. */
function paintTicker(games, label, emptyText){
  const items = [];
  const recent = games.filter(g=> label(g.hk)!==null || label(g.ak)!==null).slice(-30).reverse();
  for (const g of recent) for (const side of ["home","away"]){
    const who = label(side==="home"?g.hk:g.ak); if (who===null) continue;
    const m = side==="home"?g.hs:g.as, t = side==="home"?g.as:g.hs;
    const res = m>t?"W":m<t?"L":"T";
    items.push(`<span class="tk"><b>${esc(g[side].toUpperCase())}</b> <span class="${res==="W"?"w":res==="L"?"l":"o"}">${res==="W"?"▲":res==="L"?"▼":"■"} ${res} ${m}–${t}</span>${who?` <span class="o">${esc(who)}</span>`:""}</span>`);
  }
  const html = items.length ? items.join("") : `<span class="tk o">${emptyText}</span>`;
  $("#tickerTrack").innerHTML = items.length ? html+html : html;
}
function renderTicker(L, C){ paintTicker(C.games, k=> C.owner[k] ? C.owner[k].owner : null, "No results yet for this league's teams."); }
function renderTickerAll(){
  const own = new Map();
  for (const l of S.leagues) for (const p of (l.picks||[])) own.set(pk(l,p), p.owner);
  const one = S.leagues.length===1;
  paintTicker(allGames(), k=> own.has(k) ? (one ? own.get(k) : "") : null, S.leagues.length ? "No results yet for drafted teams." : "Results appear here once a league has drafted.");
}

function boardHTML(L, C){

  if (!C.picks.length) return `<section class="panel"><div class="card empty"><strong>The board is empty.</strong>Picks appear here as soon as the draft starts.</div></section>`;
  const rows = slotRows(L).map(s=> `<tr><td class="slot">${chip(s.pool)} ${s.many?s.ix:""}</td>${owners.map(o=>{
      const p = C.picks.find(x=>x.owner===o && x.slot===s.slot);
      if (!p) return `<td></td>`;
      const r = C.rec[pk(L,p)]||{w:0,l:0,t:0}, gp = r.w+r.l+r.t, pct = gp? r.w/gp : null;
      return `<td><div class="cell ${pct===null?"":pct>=.7?"hot":pct<=.3?"cold":""}"><span>${esc(p.team)}</span><span class="rec">${r.w}-${r.l}${r.t?"-"+r.t:""}${s.pool==="Any"?` · ${esc(p.pool)}`:""}${p.n?` · pick ${p.n}`:""}</span></div></td>`;
    }).join("")}</tr>`).join("");
  const tot = `<tr><td class="slot">Total</td>${owners.map(o=>`<td class="tot-row">${fmt(C.rows.find(r=>r.owner===o)?.total??0)} W</td>`).join("")}</tr>`;
  return `<section class="panel">
    <div class="head-row"><h2>Rosters</h2><p class="sub">Columns follow draft order. Green edge: winning 70%+. Red edge: 30% or less.</p></div>
    <div class="card scroll"><table class="board"><thead><tr><th>Slot</th>${owners.map(o=>`<th>${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}${tot}</tbody></table></div>
  </section>`;
}

function teamOptions(L, C){
  const set = new Map();
  for (const p of C.sp.pools) for (const t of C.sp.teams[p]) set.set(t.toLowerCase(), t);
  for (const g of C.games){ set.set(g.home.toLowerCase(), g.home); set.set(g.away.toLowerCase(), g.away); }
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}

/* ---------- draft ---------- */
function draftState(L){
  const owners = L.owners, N = owners.length, total = N*roundsOf(L);
  const ordered = (L.picks||[]).filter(p=>typeof p.n==="number").sort((a,b)=>a.n-b.n);
  const i = ordered.length, r = Math.floor(i/N), pos = i%N;
  const onClock = i<total ? ((L.draftType==="straight" || r%2===0) ? owners[pos] : owners[N-1-pos]) : null;
  return {owners,N,total,ordered,i,onClock,round:r+1,inRound:pos+1};
}
/* What a manager can still take: required conference/pro slots first, then "any college" slots. */
function needsFor(L, o){
  const req = {}; for (const p of SP(L).pools) req[p] = slotsOf(L)[p]||0;
  let flex = flexOf(L);
  for (const p of (L.picks||[])) if (p.owner===o){ if (String(p.slot).startsWith("Any")) flex--; else req[p.pool]--; }
  return {req, flex};
}
const canTake = (L, need, pool) => need.req[pool]>0 || (pool!==SP(L).pro && need.flex>0);

function draftHTML(L){
  const D = draftState(L), type = L.draftType==="straight"?"Straight":"Snake", sp = SP(L);
  if (L.status!=="drafting"){
    if (!D.i) return `<section class="panel"><div class="head-row"><h2>Draft</h2></div><div class="card empty"><strong>No draft on record.</strong></div></section>`;
    const rounds = Math.ceil(D.i/D.N);
    const rows = Array.from({length:rounds},(_,r)=> `<tr><td class="slot">Rd ${r+1}</td>${D.owners.map(o=>{
        const p = D.ordered.find(x=>x.owner===o && Math.ceil(x.n/D.N)===r+1);
        return p ? `<td><div class="cell"><span>${esc(p.team)}</span><span class="pkn">#${p.n} ${chip(p.pool)}</span></div></td>` : `<td></td>`;
      }).join("")}</tr>`).join("");
    return `<section class="panel">
      <div class="head-row"><h2>Draft Results</h2><p class="sub">${type} draft · ${D.N} managers · ${rounds} rounds · ${D.i} picks</p></div>
      <div class="card scroll"><table class="board rounds"><thead><tr><th>Round</th>${D.owners.map((o,i)=>`<th>${i+1}. ${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      ${canAdmin(L)?`<div class="btns"><button class="btn" id="reopen">Reopen the draft</button><span class="sub">Lets you undo or change the last picks.</span><span class="msg" id="dMsg" role="status"></span></div>`:""}
      ${seatsHTML(L)}
    </section>`;
  }
  const admin = canAdmin(L), myPick = !!(A && meId() && D.onClock && (L.members||{})[D.onClock]===meId()), canP = admin || myPick;
  const taken = new Set((L.picks||[]).map(p=>pk(L,p)));
  const need = D.onClock ? needsFor(L, D.onClock) : {req:{},flex:0};
  const q = S.draftQ.trim().toLowerCase();
  const pools = sp.pools.filter(p=> slotsOf(L)[p] || (p!==sp.pro && flexOf(L)));
  const all = pools.filter(p=>S.draftPool==="all"||S.draftPool===p).flatMap(p=>sp.teams[p].map(t=>({t,p})))
    .filter(x=>!taken.has(tk(x.t, lgOfPool(L,x.p))) && (!q || x.t.toLowerCase().includes(q)));
  const list = all.slice(0,150);
  const avail = list.map(x=>`<button class="av" data-pick="${esc(x.t)}" data-pool="${esc(x.p)}" ${(!canP||!canTake(L,need,x.p))?"disabled":""}><span>${esc(x.t)}</span>${chip(x.p)}</button>`).join("");
  const needChips = pools.filter(p=>slotsOf(L)[p]).map(p=>`<span class="need ${need.req[p]>0?"":"done"}">${chip(p)}${need.req[p]>1?` <span class="num" style="font-size:12px">×${need.req[p]}</span>`:""}</span>`).join("")
    + (flexOf(L) ? `<span class="need ${need.flex>0?"":"done"}">${chip("Any")}${need.flex>1?` <span class="num" style="font-size:12px">×${need.flex}</span>`:""}</span>` : "");
  const feed = [...D.ordered].reverse().map(p=>`<div><span class="pk">${Math.ceil(p.n/D.N)}.${String(((p.n-1)%D.N)+1).padStart(2,"0")}</span>${chip(p.pool)}<span style="flex:1"><b>${esc(p.team)}</b></span><span class="sub">${esc(p.owner)}</span></div>`).join("");
  const order = D.owners.map((o,ix)=>`<span class="pill" style="${o===D.onClock?"border-color:var(--accent);font-weight:700":""}">${ix+1}. ${esc(o)}</span>`).join("");
  return `<section class="panel">
    <div class="head-row"><h2>Draft Room</h2><p class="sub">${type} draft · ${D.N} managers · ${roundsOf(L)} rounds · ${esc(slotText(L))}</p></div>
    <div class="card clock"><div><div class="meta">On the clock · Round ${D.round}, pick ${D.inRound} · Overall ${Math.min(D.i+1,D.total)} of ${D.total}</div><div class="who">${esc(D.onClock||"Done")}</div><div class="needs">${needChips}</div></div>
      ${admin?`<div class="btns"><button class="btn danger" id="undoPick" ${D.i?"":"disabled"}>Undo last pick</button></div>`:""}</div>
    ${myPick?`<div class="banner">You're on the clock. Pick a team below.</div>`:""}
    <div class="pend-list">${order}</div>
    <div class="two">
      <div class="card">
        <div class="form" style="padding-bottom:0">
          <div class="form-grid">
            <label class="f" for="dq">Search ${all.length} available teams<input type="text" id="dq" value="${esc(S.draftQ)}" placeholder="Type a team"></label>
            <label class="f" for="dp">Pool<select id="dp"><option value="all">All pools</option>${pools.map(p=>`<option ${S.draftPool===p?"selected":""}>${p}</option>`).join("")}</select></label>
          </div>
          ${admin?`<details><summary class="sub" style="cursor:pointer">Team not listed? Add it</summary>
            <div class="form-grid" style="margin-top:8px"><label class="f" for="cT">Team<input type="text" id="cT"></label>
            <label class="f" for="cP">Pool<select id="cP">${pools.map(p=>`<option>${p}</option>`).join("")}</select></label></div>
            <div class="btns" style="margin-top:8px"><button type="button" class="btn" id="cAdd">Draft this team</button></div></details>`:(A?(myPick?"":`<p class="ro">${D.onClock?esc(D.onClock)+" is on the clock. ":""}Each manager picks on their own turn; the commissioner can pick for anyone.</p>`):`<p class="ro">The commissioner enters each pick as it's called.</p>`)}
          <span class="msg" id="dMsg" role="status"></span>
        </div>
        <div class="avail">${avail||`<span class="sub">No available teams match.</span>`}${all.length>list.length?`<span class="sub">Showing the first ${list.length}. Search to narrow the list.</span>`:""}</div>
      </div>
      <div class="card feed"><div class="day-h"><span>Picks</span><span class="sub">${D.i} made</span></div>${feed||`<div class="sub">First pick is ${esc(D.onClock)}'s.</div>`}</div>
    </div>
    ${seatsHTML(L)}
  </section>`;
}

      <label class="f" for="siPw">Password<input type="password" id="siPw" autocomplete="current-password" required></label>
      <div class="btns"><button class="btn primary" type="submit">Sign in</button><span class="msg" id="auMsg" role="status"></span></div>
      <p class="sub">New here? <button type="button" class="linkbtn" data-auth="up">Create an account</button> · <button type="button" class="linkbtn" data-auth="forgot">Forgot password</button></p>
    </form></section>`;
}
function afterSignIn(){ S.authNote=""; if (S.join) S.view="join"; else S.view="home"; render(); }

function joinHTML(){
  const j = S.join, L = j && S.leagues.find(l=>l.id===j.id);
  if (!A) return `<section class="panel"><div class="card empty"><strong>Invite links work on the website.</strong></div></section>`;
  if (!L) return `<section class="panel auth"><div class="card empty"><strong>That league wasn't found.</strong>The link may be old. Ask the commissioner for a new one.</div></section>`;
  const head = `<div class="card lg-card"><span class="sport-tag">${SP(L).label} · ${seasonLabel(L.year)}</span><div class="nm">${esc(L.name)}</div><div class="kv">${L.owners.length} managers · ${esc(slotText(L))}</div></div>`;
  if (!meId()) return `<section class="panel auth"><div class="head-row"><h2>You're invited</h2></div>${head}
    <div class="card form"><p class="sub">Sign in or create an account to take your spot in this league.</p>
    <div class="btns"><button class="btn primary" data-auth="up">Create an account</button><button class="btn" data-auth="in">Sign in</button></div></div></section>`;
  const mineSeat = mine(L), m = L.members || {};
  if (mineSeat) return `<section class="panel auth"><div class="head-row"><h2>You're in</h2></div>${head}
    <div class="card form"><p>You manage <b>${esc(mineSeat)}</b> in this league.</p><div class="btns"><button class="btn primary" data-go="${esc(L.id)}">Open my team</button></div></div></section>`;
  const open = L.owners.filter(o=>!m[o]);
  return `<section class="panel auth"><div class="head-row"><h2>Join this league</h2></div>${head}
    <div class="card form"><h3>Which manager are you?</h3>
      ${open.length ? `<ul class="seats">${open.map(o=>`<li><span class="who">${esc(o)}</span><button type="button" class="btn primary" data-seat="${esc(o)}">That's me</button></li>`).join("")}</ul>` : `<p>Every spot in this league is taken. Ask the commissioner to free yours.</p>`}
      <span class="msg" id="jnMsg" role="status"></span></div></section>`;
}

/* Commissioner's panel on the Draft tab: the invite link and who has joined. */
function seatsHTML(L){
  if (!A || !canAdmin(L)) return "";
  const code = S.invites[L.id], m = L.members || {};
  if (code===undefined){ S.invites[L.id] = null; A.invite(L.id).then(c=>{ S.invites[L.id]=c; render(); }).catch(()=>{ S.invites[L.id]=""; render(); }); }
  const link = code ? `${PUBLIC_BASE}#join.${L.id}.${code}` : "";
  const joined = L.owners.filter(o=>m[o]).length;
  return `<div class="card form"><div class="head-row"><h3>Managers and invites</h3><span class="sub">${joined} of ${L.owners.length} joined</span></div>
    <p class="sub">Send this link to your managers. Each one signs in and chooses their name. Until someone joins, you can pick for them. If you play in this league too, tap "That's me" next to your own name.</p>
    ${link ? `<div class="share"><input type="text" readonly id="inv-${esc(L.id)}" value="${esc(link)}" aria-label="Invite link"><button type="button" class="btn" data-copy="inv-${esc(L.id)}">Copy invite link</button></div>` : `<p class="sub">${code===""?"The invite link couldn't be loaded.":"Loading the invite link…"}</p>`}
    <ul class="seats">${L.owners.map(o=>`<li><span class="who">${esc(o)}</span><span class="sub">${m[o] ? (m[o]===meId()?"You":"Joined") : "Not joined yet"}</span>${m[o]?`<button type="button" class="btn" data-release="${esc(o)}" style="padding:4px 10px;font-size:12.5px">${m[o]===meId()?"Leave":"Free this spot"}</button>`:(!mine(L)&&code?`<button type="button" class="btn" data-take="${esc(o)}" style="padding:4px 10px;font-size:12.5px">That's me</button>`:"")}</li>`).join("")}</ul>
    <span class="msg" id="stMsg" role="status"></span></div>`;
}

function bindAccounts(){
  if (!A) return;
  document.querySelectorAll("[data-auth]").forEach(b=> b.onclick=()=>{ S.authMode=b.dataset.auth; S.view="auth"; render(); try{ window.scrollTo(0,0); }catch(_){} });
  const ah=$("#authHome"); if(ah) ah.onclick=()=> afterSignIn();
  const si=$("#signInForm"); if(si) si.onsubmit=async e=>{ e.preventDefault(); setMsg("#auMsg","Signing in…",true);
    try{ await A.signIn($("#siEmail").value.trim(), $("#siPw").value); S.reset.add("siPw"); }catch(err){ setMsg("#auMsg",failText(err)); } };
  const su=$("#signUpForm"); if(su) su.onsubmit=async e=>{ e.preventDefault();
    const username=$("#suUser").value.trim(), email=$("#suEmail").value.trim(), password=$("#suPw").value, full_name=$("#suName").value.trim(), phone=$("#suPhone").value.trim();
    if(!/^[A-Za-z0-9_.-]{3,24}$/.test(username)) return setMsg("#auMsg","Usernames are 3 to 24 letters, numbers, dots, dashes or underscores.");
    if(password.length<8) return setMsg("#auMsg","Use a password of at least 8 characters.");
    setMsg("#auMsg","Creating your account…",true);
    try{
      if(!(await A.usernameAvailable(username))) return setMsg("#auMsg","That username is taken. Try another.");
      const r = await A.signUp({email, password, username, full_name, phone});
      ["suPw"].forEach(id=>S.reset.add(id));
      if (r.needsConfirm){ S.authEmail=email; S.authMode="check"; render(); }
    }catch(err){ setMsg("#auMsg",failText(err)); } };
  const fg=$("#forgotForm"); if(fg) fg.onsubmit=async e=>{ e.preventDefault();
    try{ await A.resetPassword($("#fgEmail").value.trim()); setMsg("#auMsg","If that email has an account, a reset link is on its way.",true); }catch(err){ setMsg("#auMsg",failText(err)); } };
  const np=$("#newPwForm"); if(np) np.onsubmit=async e=>{ e.preventDefault();
    try{ await A.updatePassword($("#npPw").value); S.authMode="in"; afterSignIn(); }catch(err){ setMsg("#auMsg",failText(err)); } };
  const ac=$("#acctForm"); if(ac) ac.onsubmit=async e=>{ e.preventDefault();
    const username=$("#acUser").value.trim();
    if(!/^[A-Za-z0-9_.-]{3,24}$/.test(username)) return setMsg("#acMsg","Usernames are 3 to 24 letters, numbers, dots, dashes or underscores.");
    try{ await A.updateProfile({username, full_name:$("#acName").value.trim(), phone:$("#acPhone").value.trim()||null}); setMsg("#acMsg","Saved.",true); }catch(err){ setMsg("#acMsg",failText(err)); } };
  const pw=$("#pwForm"); if(pw) pw.onsubmit=async e=>{ e.preventDefault();
    try{ await A.updatePassword($("#pwNew").value); S.reset.add("pwNew"); render(); setMsg("#pwMsg","Password changed.",true); }catch(err){ setMsg("#pwMsg",failText(err)); } };
  const al=$("#alertForm"); if(al) al.onsubmit=async e=>{ e.preventDefault();
    try{ await A.updateProfile({alerts:{draft:$("#alDraft").checked, weekly:$("#alWeekly").checked}}); setMsg("#alMsg","Saved.",true); }catch(err){ setMsg("#alMsg",failText(err)); } };
  const lo=$("#logout"); if(lo) lo.onclick=async()=>{ await A.signOut(); S.view="home"; render(); };
  document.querySelectorAll("[data-seat]").forEach(b=> b.onclick=async()=>{
    const j=S.join; try{ await A.join(j.id, j.code, b.dataset.seat); S.join=null; go("league", j.id, "team"); }catch(err){ setMsg("#jnMsg",failText(err)); } });
  document.querySelectorAll("[data-take]").forEach(b=> b.onclick=async()=>{
    const L=league(); try{ await A.join(L.id, S.invites[L.id], b.dataset.take); }catch(err){ setMsg("#stMsg",failText(err)); } });
  document.querySelectorAll("[data-release]").forEach(b=> b.onclick=async()=>{
    try{ await A.releaseSeat(league().id, b.dataset.release); }catch(err){ setMsg("#stMsg",failText(err)); } });
}

/* ---------- events ---------- */
function setMsg(id, text, ok){ const m=$(id); if(m){ m.textContent=text; m.className="msg "+(ok?"ok":"err"); } }
function failText(e){ return e?.code==="backend" ? e.message : e?.code==="invalid_argument" ? "You don't have permission to change league data." : e?.code==="quota_exceeded" ? "The league file is full." : "That didn't save. Check your connection and try again."; }

function bind(){
  bindAccounts();
  document.querySelectorAll("tr.row").forEach(tr=>{
    const tog = ()=>{ const o=tr.dataset.owner; S.open.has(o)?S.open.delete(o):S.open.add(o); render(); };
    tr.onclick = tog; tr.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tog(); } };
  });
  document.querySelectorAll("[data-only]").forEach(b=> b.onclick=()=>{ S.onlyMine = b.dataset.only==="1"; render(); });
  document.querySelectorAll("[data-sport]").forEach(b=> b.onclick=()=>{ S.sportFilter = b.dataset.sport; render(); });
  document.querySelectorAll("[data-go]").forEach(b=> b.onclick=()=> go("league", b.dataset.go));
  document.querySelectorAll("[data-claim]").forEach(s=> s.onchange=()=>{
    const id=s.dataset.claim; if (s.value) S.me[id]=s.value; else delete S.me[id]; saveMe(); S.reset.add(s.id);
    if (S.view==="league") S.tab="team"; render();
  });
  document.querySelectorAll("[data-unclaim]").forEach(b=> b.onclick=()=>{ delete S.me[b.dataset.unclaim]; saveMe(); render(); });
  document.querySelectorAll("[data-theme-pick]").forEach(b=> b.onclick=()=>{ S.theme=b.dataset.themePick; try{ localStorage.setItem("pf-theme",S.theme); }catch(_){} applyTheme(); render(); });
  const fg=$("#forget"); if(fg) fg.onclick=()=>{ S.me={}; saveMe(); render(); };
  const sb=$("#setBack"); if(sb) sb.onclick=()=> go("home");
  const mw=$("#moreWeeks"); if(mw) mw.onclick=()=>{ S.weeksShown+=3; render(); };
  const gf=$("#gameForm"); if(gf) gf.onsubmit=addGame;
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=> delGame(b.dataset.del));
  const dq=$("#dq"); if(dq) dq.oninput=()=>{ S.draftQ=dq.value; render(); };
  const dp=$("#dp"); if(dp) dp.onchange=()=>{ S.draftPool=dp.value; render(); };
  document.querySelectorAll("[data-pick]").forEach(b=> b.onclick=()=> makePick(b.dataset.pick, b.dataset.pool));
  const cAdd=$("#cAdd"); if(cAdd) cAdd.onclick=()=>{ const t=$("#cT").value.trim(); if(t) makePick(t, $("#cP").value); };
  const u=$("#undoPick"); if(u) u.onclick=undoPick;
  const ro=$("#reopen"); if(ro) ro.onclick=reopenDraft;
  document.querySelectorAll("[data-copy]").forEach(b=> b.onclick=async()=>{
    const inp = document.getElementById(b.dataset.copy); if (!inp) return;
    try{ await navigator.clipboard.writeText(inp.value); b.textContent = "Copied"; }
    catch(_){ inp.focus(); inp.select(); b.textContent = "Selected: copy it"; }
  });
  document.querySelectorAll("[data-dellg]").forEach(b=> b.onclick=()=> delLeague(b.dataset.dellg));
  document.querySelectorAll("[data-mv]").forEach(b=> b.onclick=()=>{ const [i,d]=b.dataset.mv.split("|").map(Number), a=S.newMgrs; [a[i],a[i+d]]=[a[i+d],a[i]]; render(); });
  document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>{ S.newMgrs.splice(+b.dataset.rm,1); render(); });
  const addM = ()=>{ const el=$("#mgrName"), v=el.value.trim(); if(!v) return; if(S.newMgrs.some(m=>m.toLowerCase()===v.toLowerCase())) return setMsg("#lgMsg",`${v} is already on the list.`); S.newMgrs.push(v); S.reset.add("mgrName"); render(); $("#mgrName")?.focus(); };
  const ma=$("#mgrAdd"); if(ma) ma.onclick=addM;
  const mn=$("#mgrName"); if(mn) mn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addM(); } };
  const ms=$("#mgrShuffle"); if(ms) ms.onclick=()=>{ const a=S.newMgrs; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } render(); };
  const mc=$("#mgrCopy"); if(mc) mc.onclick=()=>{ S.newMgrs=[...(league()?.owners||[])]; render(); };
  const ls=$("#lgSport"); if(ls) ls.onchange=()=>{ S.newSport=ls.value; document.querySelectorAll("#lgForm input[type=number], #lgProW").forEach(e=>S.reset.add(e.id)); S.reset.add("lgFlex"); S.reset.add("lgProW"); render(); };
  const lf=$("#lgForm"); if(lf) lf.onsubmit=createLeague;
}

async function addGame(e){
  e.preventDefault();
  const date=$("#gDate").value, lg=$("#gLg").value, home=canonName($("#gHome").value,lg), away=canonName($("#gAway").value,lg);
  const hs=parseInt($("#gHs").value,10), as=parseInt($("#gAs").value,10);
  if(!date||!home||!away||isNaN(hs)||isNaN(as)) return setMsg("#gMsg","Fill in both teams, both scores and the date.");
  if(tk(home,lg)===tk(away,lg)) return setMsg("#gMsg","A team can't play itself.");
  const ref = S.db.doc(`games/${date}`);
  try{
    const snap = await ref.get();
    const games = snap.exists ? (snap.data().games||[]).filter(g=> !(normLg(g.lg)===lg && tk(g.home,lg)===tk(home,lg) && tk(g.away,lg)===tk(away,lg))) : [];
    games.push({lg, home, away, hs, as});
    await ref.set({date, games});
    ["gHome","gHs","gAway","gAs"].forEach(id=>S.reset.add(id));
    render();
    setMsg("#gMsg",`Saved: ${away} ${as}, ${home} ${hs}. ${hs===as?"Tie":(hs>as?home:away)+" win"}.`,true);
    $("#gHome")?.focus();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}
async function delGame(id){
  if(S.confirmDel!==id){ S.confirmDel=id; return render(); }
  S.confirmDel=null;
  const [docId,lg,home,away]=id.split("|");
  const ref=S.db.doc(`games/${docId}`);
  try{
    const snap=await ref.get(); if(!snap.exists) return render();
    const d=snap.data(), games=(d.games||[]).filter(g=> !(normLg(g.lg||d.lg)===lg && g.home===home && g.away===away));
    if(games.length || d.src==="auto") await ref.set({...d, games}); else await ref.delete();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}

async function makePick(team, pool){
  const L=league(), D=draftState(L); if(!D.onClock) return;
  const lg = lgOfPool(L, pool);
  team = canonName(team, lg);
  if ((L.picks||[]).some(p=>pk(L,p)===tk(team,lg))) return setMsg("#dMsg",`${team} is already drafted.`);
  const need = needsFor(L, D.onClock);
  if (!canTake(L, need, pool)) return setMsg("#dMsg",`${D.onClock} has no open slot for a ${pool} team.`);
  let slot;
  if (need.req[pool]>0){ const many = slotsOf(L)[pool]>1; slot = many ? `${pool} #${slotsOf(L)[pool]-need.req[pool]+1}` : pool; }
  else { const f = flexOf(L); slot = f>1 ? `Any #${f-need.flex+1}` : "Any"; }
  const picks = [...(L.picks||[]), {n:D.i+1, owner:D.onClock, team, pool, slot}];
  try{
    if (A) await A.makePick(L.id, team, pool, slot);
    else await S.db.doc(`leagues/${L.id}`).update({picks, status: picks.length>=D.total?"complete":"drafting"});
    S.draftQ=""; S.reset.add("dq"); S.reset.add("cT"); render();
  }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function undoPick(){
  const L=league(), D=draftState(L); if(!D.i) return;
  const last=D.ordered[D.ordered.length-1];
  try{ await S.db.doc(`leagues/${L.id}`).update({picks:(L.picks||[]).filter(p=>p.n!==last.n), status:"drafting"}); }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function reopenDraft(){
  try{ await S.db.doc(`leagues/${league().id}`).update({status:"drafting"}); }catch(err){ setMsg("#dMsg",failText(err)); }
}
async function createLeague(e){
  e.preventDefault();
  const sport = S.newSport, sp = SPORTS[sport];
  const name=$("#lgName").value.trim(), year=+$("#lgYear").value, draftType=$("#lgType").value, owners=[...S.newMgrs];
  const slots={}; for(const p of sp.pools){ const el=$("#sl-"+poolCls(p)); slots[p]= el ? Math.max(0,Math.min(10,parseInt(el.value,10)||0)) : 0; }
  const flex = $("#lgFlex") ? Math.max(0,Math.min(12,parseInt($("#lgFlex").value,10)||0)) : 0;
  const weights = {}; if ($("#lgProW") && +$("#lgProW").value!==1) weights[sp.pro] = +$("#lgProW").value;
  if(!name) return setMsg("#lgMsg","Name the league.");
  if(owners.length<2) return setMsg("#lgMsg","Add at least two managers.");
  if(!sp.pools.some(p=>slots[p]) && !flex) return setMsg("#lgMsg","Each manager needs at least one team.");
  for(const p of sp.pools) if(owners.length*slots[p]>sp.teams[p].length) return setMsg("#lgMsg",`${owners.length} managers × ${slots[p]} ${p} teams is more than the ${sp.teams[p].length} ${p} teams available.`);
  let id=(name+"-"+sport+"-"+year).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"league";
  if(S.leagues.some(l=>l.id===id)) id+="-"+Math.random().toString(36).slice(2,6);
  try{
    await S.db.doc(`leagues/${id}`).set({name, sport, year, owners, slots, flex, weights, draftType, status:"drafting", picks:[], created:new Date().toISOString()});
    S.newMgrs=[]; S.reset.add("lgName"); S.leagueId=id; S.view="league"; S.tab="draft"; render();
  }catch(err){ setMsg("#lgMsg",failText(err)); }
}
async function delLeague(id){
  if(S.confirmLg!==id){ S.confirmLg=id; return render(); }
  S.confirmLg=null;
  try{ await S.db.doc(`leagues/${id}`).delete(); }catch(err){ setMsg("#lgMsg",failText(err)); }
}

/* ---------- boot ---------- */
document.querySelectorAll(".tab").forEach(b=> b.onclick=()=>{ S.tab=b.dataset.tab; S.confirmDel=S.confirmLg=null; render(); });
$("#leagueSel").onchange=e=>{ e.target.value ? go("league", e.target.value) : go("home"); };
$("#brandLink").onclick=e=>{ e.preventDefault(); go("home"); };
$("#gearBtn").onclick=()=> go(S.view==="settings" ? "home" : "settings");
$("#signBtn").onclick=()=>{ S.authMode="in"; go("auth"); };
if (A) A.onChange(st=>{
  const was = meId();
  S.auth = {user:st.user, profile:st.profile, live:st.live};
  if (st.recovery){ S.view="auth"; S.authMode="newpw"; }
  else if (!was && meId() && (S.view==="auth")) return afterSignIn();
  if (!meId()) S.invites = {};
  render();
});
loadLocal(); applyTheme(); applyHash();
window.addEventListener("hashchange", ()=>{ applyHash(); settleLeague(); render(); });

(async function boot(){
  const db = await (window.claude?.use ? window.claude.use("db") : null);
  S.db = db;
  if(!db){ render(); return; }
  const user = await window.claude.use("user");
  S.canWrite = (user ? await user.can("data.write") : null) !== false;
  db.collection("leagues").limit(200).onSnapshot(q=>{
    S.leagues = q.docs.map(d=>({id:d.id, ...d.data()})).filter(l=>l.name && Array.isArray(l.owners)).sort((a,b)=> (a.created||"")<(b.created||"")?-1:1);
    const first = !S.leaguesLoaded; S.leaguesLoaded = true;
    if (first){
      // opened with no address: go straight to your portfolio if you have exactly one
      const my = S.leagues.filter(l=>mine(l));
      let standalone=false; try{ standalone = navigator.standalone===true || matchMedia("(display-mode: standalone)").matches; }catch(_){}
      if (!location.hash && standalone && my.length===1){ S.view="league"; S.wantLeague=my[0].id; S.wantTab="team"; }
    }
    settleLeague(); render();
  }, ()=>{});
  db.collection("games").limit(1000).onSnapshot(q=>{ S.gameDocs = q.docs.map(d=>({_id:d.id, ...d.data()})); render(); }, ()=>{});
  db.doc("meta/sync").onSnapshot(s=>{ S.sync = s.exists ? s.data() : null; render(); }, ()=>{});
})();
</script>
