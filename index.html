<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Portfolio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Portfolio">
<meta name="theme-color" content="#0f2a1e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.pubnote{max-width:1080px;margin:0 auto;padding:0 16px 28px;font-size:12.5px;color:var(--muted)}</style>
<script src="vendor/supabase.js"></script>
<script src="backend.js"></script>
</head>
<body>
<title>The Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a trading-floor ledger. Wordmark + live ticker on top, tabbed desk below; tables carry the page. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1; --fg:#14201a; --muted:#5d6b62;
  --accent:#0d6a45; --accent-ink:#ffffff; --accent-soft:#dcefe4;
  --up:#0d7a4b; --down:#b4362b; --gold:#a07612;
  --ticker-bg:#0f2a1e; --ticker-fg:#d9efe2;
  --nfl:#1f4e9c; --acc:#c25412; --b10:#2d6fb8; --b12:#b8292f; --sec:#7a3fa5; --np4:#4f7a2a; --be:#0e7f86;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c; --be:#5fcfd6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#121e18; --sunk:#0a120e; --line:#24352c; --fg:#e4ede7; --muted:#90a297;
  --accent:#3fbf86; --accent-ink:#06130d; --accent-soft:#163326;
  --up:#4cc98f; --down:#f0766a; --gold:#e0b44a;
  --ticker-bg:#06100b; --ticker-fg:#bfe3cf;
  --nfl:#7ea6ec; --acc:#f09a5c; --b10:#7fb3ec; --b12:#f07a7f; --sec:#c39ae6; --np4:#9bc96c; --be:#5fcfd6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* masthead */
header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
#signBtn{white-space:nowrap;padding:7px 12px;font-size:14px}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.season-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.season-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg)}

/* ticker */
.ticker{background:var(--ticker-bg);color:var(--ticker-fg);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:12.5px;border-block:1px solid var(--line)}
.ticker-track{display:inline-flex;gap:28px;padding:8px 0;animation:tick 60s linear infinite;padding-left:16px}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk b{font-weight:600;color:#fff}
.tk .w{color:#5fe0a0}.tk .l{color:#ff8f84}.tk .o{opacity:.65}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker{overflow-x:auto}.ticker-track{animation:none}}
:root[data-theme="light"] .tk b{color:#fff}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:12px 14px 10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:20px 60px}
section.panel{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:0}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto;min-width:0}

/* standings */
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.st td{border-bottom:1px solid var(--line)}
.st tr.row{cursor:pointer}
.st tr.row:hover td{background:var(--sunk)}
.st tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.r{text-align:right}
.rk{width:34px;color:var(--muted)}
.mgr{font-weight:600}
.tot{font-size:20px;font-weight:600}
.lead .rk{color:var(--gold);font-weight:700}
.chev{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
tr.open .chev{transform:rotate(90deg)}
.delta.up{color:var(--up)}.delta.zero{color:var(--muted)}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:5px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--accent)}
.detail td{background:var(--sunk);padding:12px 12px 14px}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px}
.h-item{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 0}
.h-item .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-item .rec{font-family:var(--mono);font-size:13px}

.chip{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.p-NFL{--c:var(--nfl)}.p-ACC{--c:var(--acc)}.p-Big-Ten{--c:var(--b10)}.p-Big-12{--c:var(--b12)}.p-SEC{--c:var(--sec)}.p-Non-P4{--c:var(--np4)}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ld{padding:12px;display:flex;flex-direction:column;gap:4px}
.ld .t{font-weight:600}
.ld .o{font-size:12.5px;color:var(--muted)}
.ld .n{font-family:var(--mono);font-size:22px;font-weight:600}

/* board */
.board th,.board td{border:1px solid var(--line);font-size:13px;vertical-align:top}
.board thead th{background:var(--surface);position:sticky;top:0}
.board td{min-width:118px;background:var(--surface)}
.board td.slot{min-width:84px;background:var(--sunk);font-weight:600}
.cell{display:flex;flex-direction:column;gap:2px}
.cell .rec{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell.hot{box-shadow:inset 3px 0 0 var(--up)}
.cell.cold{box-shadow:inset 3px 0 0 var(--down)}
.board td.tot-row{font-family:var(--mono);font-weight:600;background:var(--sunk)}

/* forms */
.form{padding:16px;display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--down)}.msg.ok{color:var(--up)}

/* results log */
.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.game{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.game:last-child{border-bottom:0}
.side{display:flex;flex-direction:column;min-width:0}
.side.right{text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.won .nm{font-weight:700}
.side .own{font-size:11.5px;color:var(--accent);font-weight:600}
.score{font-family:var(--mono);font-weight:600;white-space:nowrap}
.lg{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:13px}
.x:hover{color:var(--down)}
.x.confirm{color:var(--accent-ink);background:var(--down)}
details.pend{padding:12px 14px}
details.pend summary{cursor:pointer;font-weight:600;font-size:14px}
.pend-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}

/* draft */
.clock{padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-color:var(--accent)}
.clock .who{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.clock .meta{color:var(--muted);font-size:13px}
.clock-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tm{text-align:right}
.tm .t{font-family:var(--mono);font-weight:600;font-size:clamp(30px,7vw,44px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm .lab{font-size:12px;color:var(--muted);margin-top:4px}
.tm.low .t{color:var(--down)}
.tm.paused .t{font-family:var(--body,inherit);font-size:18px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag-auto{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:500}
@media (max-width:520px){.clock{grid-template-columns:1fr}.clock-side{flex-direction:row;justify-content:space-between;align-items:center;width:100%}.tm{text-align:left}}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.need.done{opacity:.35;text-decoration:line-through}
.avail{max-height:560px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:12px}
.av{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.av:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.av:disabled{opacity:.35;cursor:not-allowed}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.feed .pk{font-family:var(--mono);color:var(--muted);width:46px}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.clock{grid-template-columns:1fr}}

.empty{padding:32px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.ro{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

@media (max-width:520px){
  th,td{padding:9px 5px}
  .hide-sm{display:none}
  .tot{font-size:18px}
  .game{grid-template-columns:1fr auto 1fr;}
  .game .x{grid-column:1/-1;justify-self:end}
}

/* leagues */
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lg-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.lg-card.cur{border-color:var(--accent)}
.lg-card .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.lg-card .kv{font-size:13px;color:var(--muted)}
.lg-card .kv b{color:var(--fg);font-weight:600}
.status{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:var(--accent);border-color:var(--accent)}
.mgr-list{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.mgr-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mgr-list .ord{font-family:var(--mono);color:var(--muted);width:24px}
.mgr-list .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;width:30px;height:30px;cursor:pointer;line-height:1}
.ib:hover:not(:disabled){border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.dot.off{background:var(--muted)}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:uppercase}
.rounds td{min-width:112px}
.rounds .pkn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.league-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.league-pick select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);max-width:240px}

/* front page */
.brand h1 a{color:inherit;text-decoration:none}
.brand h1 a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hero{display:grid;gap:14px;padding-block:6px 2px}
.hero h2{font-size:clamp(42px,10vw,84px);font-weight:900;line-height:.9;letter-spacing:.005em}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{font-size:17px;line-height:1.5;max-width:60ch;margin:0}
.facts{display:flex;gap:6px 20px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.steps li{padding:16px;display:flex;flex-direction:column;gap:6px}
.steps .n{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;color:var(--accent)}
.steps li h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg)}
.steps li p{margin:0;font-size:14px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.share{display:flex;gap:6px;align-items:stretch}
.share input[type=text]{font-family:var(--mono);font-size:11.5px;padding:6px 8px;color:var(--muted)}
.share .btn{padding:6px 10px;font-size:12.5px;white-space:nowrap}

/* v5: app shell */
.p-NBA{--c:var(--nfl)}.p-Big-East{--c:var(--be)}.p-Other{--c:var(--np4)}.p-Any{--c:var(--muted)}
.topbar{display:flex;align-items:center;gap:8px}
.gear{appearance:none;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:6px;width:36px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.gear:hover{border-color:var(--muted)}
.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sports{display:flex;gap:6px;flex-wrap:wrap}
.sports button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.sports button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sports button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pf{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pf:hover{border-color:var(--accent)}
.pf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pf .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.pf .big{display:flex;align-items:baseline;gap:8px}
.pf .big .bn{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.pf .kv{font-size:13px;color:var(--muted)}
.pf .kv b{color:var(--fg);font-weight:600}
.sport-tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.claim{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.claim select{width:auto;padding:6px 8px}
.me-head{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.me-head .who{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,40px);text-transform:uppercase;line-height:1}
.me-head .n{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;text-align:right}

a State","n. dakota state":"North Dakota State","s. alabama":"South Alabama","cal":"California","jax state":"Jacksonville State","nevada-las vegas":"UNLV","bowling green state":"Bowling Green",
  "saint john's":"St. John's","st. john's (ny)":"St. John's","uncw":"UNC Wilmington","uncg":"UNC Greensboro","etsu":"East Tennessee State","fgcu":"Florida Gulf Coast","siue":"SIU Edwardsville","semo":"Southeast Missouri State","loyola (chi)":"Loyola Chicago","loyola-chicago":"Loyola Chicago","loyola (md)":"Loyola Maryland","st. mary's":"Saint Mary's","saint mary's (ca)":"Saint Mary's","st. joseph's":"Saint Joseph's","st. peter's":"Saint Peter's","st. louis":"Saint Louis","iupui":"IU Indy","umkc":"Kansas City","citadel":"The Citadel","grambling":"Grambling State","southern university":"Southern","pennsylvania":"Penn","long island university":"LIU","texas a&m-cc":"Texas A&M-Corpus Christi","ut rio grande valley":"UTRGV","sf austin":"Stephen F. Austin","california baptist":"Cal Baptist","csu bakersfield":"Cal State Bakersfield","detroit":"Detroit Mercy","college of charleston":"Charleston"};

const A = window.portfolioAuth || null;

const TIMERS = [[0,"No timer"],[30,"30 seconds"],[60,"1 minute"],[90,"90 seconds"],[120,"2 minutes"],[300,"5 minutes"],[3600,"1 hour"],[14400,"4 hours"],[43200,"12 hours"],[86400,"24 hours"]];

const flexOf = L => typeof L.flex==="number" ? L.flex : (L.slots ? 0 : SP(L).flex);
const weightOf = (L, pool) => { const w = (L.weights || SP(L).weights || {})[pool]; return typeof w==="number" ? w : 1; };
const lgOfPool = (L, pool) => pool===SP(L).pro ? SP(L).pro : SP(L).col;
const pk = (L, p) => tk(p.team, lgOfPool(L, p.pool));
const roundsOf = L => SP(L).pools.reduce((n,p)=> n + (slotsOf(L)[p]||0), 0) + flexOf(L);
function slotRows(L){
  const out=[];
  for (const p of SP(L).pools){ const n=slotsOf(L)[p]||0; for (let i=1;i<=n;i++) out.push({slot: n>1?`${p} #${i}`:p, pool:p, ix:i, many:n>1}); }
  const f = flexOf(L); for (let i=1;i<=f;i++) out.push({slot: f>1?`Any #${i}`:"Any", pool:"Any", ix:i, many:f>1});
  return out;
}
const slotText = L => SP(L).pools.filter(p=>slotsOf(L)[p]).map(p=>`${slotsOf(L)[p]} ${p==="Other"?"other-conference":p}`).concat(flexOf(L)?[`${flexOf(L)} any college`]:[]).join(" · ");
const weightText = L => SP(L).pools.filter(p=>weightOf(L,p)!==1).map(p=>`${p} wins count ${weightOf(L,p)}`).join(" · ");
const mine = L => {
  if (A){ const id = meId(), m = L.members || {}; return id ? (L.owners.find(o=>m[o]===id) || null) : null; }
  const o = S.me[L.id]; return o && L.owners.includes(o) ? o : null;
};

/* ---------- games: one list for every league, de-duplicated ---------- */
let _games = null;
function allGames(){
  if (_games) return _games;
  const seen = new Map();
  for (const d of S.gameDocs) (d.games||[]).forEach(g=>{
    const lg = normLg(g.lg || d.lg), date = g.date||d.date, hs=+g.hs, as=+g.as;
    if (!/^\d{4}-\d\d-\d\d$/.test(date||"") || !isFinite(hs) || !isFinite(as) || !g.home || !g.away) return;
    const G = {doc:d._id, lg, date, home:canonName(g.home,lg), away:canonName(g.away,lg), rawHome:g.home, rawAway:g.away, rawLg:g.lg, hs, as, rank:({auto:1,sheet:2})[g.src||d.src]||3};
    const a = tk(G.home,lg), b = tk(G.away,lg);
    G.hk=a; G.ak=b;
    // basketball teams can meet twice in a week, so those games are keyed by day; football by week
    const span = (lg==="NBA"||lg==="CBB") ? date : weekStart(date);
    const k = span+"|"+(a<b?a+"|"+b:b+"|"+a);
    const prev = seen.get(k);
    if (!prev || G.rank>prev.rank) seen.set(k, G);   // a hand-entered result outranks an automatic one
  });
  return _games = [...seen.values()].sort((x,y)=> x.date<y.date?-1:x.date>y.date?1:0);
}
const winnerKey = g => g.hs===g.as ? null : (g.hs>g.as ? g.hk : g.ak);

function compute(L){
  const sp = SP(L), y = L.year || thisSeason();
  const lo = `${y}-07-01`, hi = `${y+1}-06-30`;
  const games = allGames().filter(g=> g.date>=lo && g.date<=hi && (g.lg===sp.pro || g.lg===sp.col));
  const rec = {}; const R = k => rec[k] || (rec[k] = {w:0,l:0,t:0,games:[]});
  for (const g of games){
    if (g.hs===g.as){ R(g.hk).t++; R(g.ak).t++; }
    else if (g.hs>g.as){ R(g.hk).w++; R(g.ak).l++; }
    else { R(g.ak).w++; R(g.hk).l++; }
    R(g.hk).games.push(g); R(g.ak).games.push(g);
  }
  const lastDate = games.length ? games[games.length-1].date : null;
  const curWeek = lastDate ? weekStart(lastDate) : null;
  const firstWeek = games.length ? weekStart(games[0].date) : null;
  const weekNo = curWeek ? Math.round((toD(curWeek)-toD(firstWeek))/(7*864e5))+1 : 0;
  const picks = L.picks || [], owner = {};
  for (const p of picks) owner[pk(L,p)] = p;
  const order = slotRows(L).map(s=>s.slot);
  const rows = (L.owners||[]).map(o=>{
    let pro=0, col=0, total=0, wk=0;
    const holdings = picks.filter(p=>p.owner===o).map(p=>{
      const k = pk(L,p), r = rec[k] || {w:0,l:0,t:0,games:[]}, wt = weightOf(L,p.pool);
      if (p.pool===sp.pro) pro+=r.w; else col+=r.w;
      total += r.w*wt;
      const wkG = r.games.filter(g=>weekStart(g.date)===curWeek);
      wk += wkG.filter(g=>winnerKey(g)===k).length*wt;
      return {...p, k, w:r.w, l:r.l, t:r.t, pts:r.w*wt, wt, wkG};
    }).sort((a,b)=> order.indexOf(a.slot)-order.indexOf(b.slot));
    return {owner:o, pro, col, total, wk, holdings};
  });
  rows.sort((a,b)=> b.total-a.total || b.pro-a.pro || a.owner.localeCompare(b.owner));
  let rank = 0;
  rows.forEach((r,i)=>{ if (i===0 || r.total!==rows[i-1].total) rank=i+1; r.rank=rank; });
  const top = rows[0]?.total || 0; rows.forEach(r=> r.gb = top-r.total);
  return {games, rec, owner, rows, curWeek, weekNo, lastDate, picks, sp};
}

/* ---------- routing: #home, #settings, #<league>, #<league>.<tab> ---------- */
const PUBLIC_BASE = window.PORTFOLIO_PUBLIC ? location.origin + location.pathname : "https://playtheportfolio.com/";
const leagueURL = id => PUBLIC_BASE + "#" + id;
const TABS = ["league","team","standings","board","results","draft","chat"];
function applyHash(){
  const h = (location.hash||"").slice(1);
  if (!h || h==="home"){ S.view = "home"; return; }
  if (h==="settings"){ S.view = "settings"; return; }
  if (h==="signin"){ S.view = "auth"; return; }
  if (/access_token=|error=|type=recovery/.test(h)){ S.view = "home"; return; }   // a sign-in link from an email; the account code reads it
  if (h.startsWith("join.")){ const [, jid, code] = h.split("."); S.join = {id:jid, code:code||""}; S.view = "join";
    try{ localStorage.setItem("pf-join", JSON.stringify({id:jid, code:code||"", t:Date.now()})); }catch(_){}   // survives the trip out to an email link or Google
    return; }
  const [lid, tab] = h.split(".");
  S.view = "league"; S.wantLeague = lid; S.wantTab = TABS.includes(tab) ? tab : null;
}
function settleLeague(){
  if (S.wantLeague && S.leaguesLoaded){
    const L = S.leagues.find(l=>l.id===S.wantLeague);
    if (L){ S.leagueId = L.id; S.tab = S.wantTab || "league"; } else S.view = "home";
    S.wantLeague = S.wantTab = null;
  }
  if (!S.leagues.some(l=>l.id===S.leagueId)) S.leagueId = (S.leagues.find(l=>mine(l)) || S.leagues[0])?.id || null;
}
function syncHash(){
  const L = league();
  const want = S.view==="settings" ? "settings" : S.view==="auth" ? "signin" : (S.view==="join" && S.join) ? `join.${S.join.id}.${S.join.code}` : (S.view==="league" && L) ? L.id + "." + S.tab : "";
  const have = (location.hash||"").slice(1);
  if (have===want || (want==="" && have==="home")) return;
  if (/access_token=|error=|type=recovery/.test(have)) return;
  try{ history.replaceState(null, "", want ? "#"+want : location.pathname + location.search); }catch(_){}
}
function go(view, id, tab){
  S.view = view; S.confirmDel = S.confirmLg = null;
  if (view==="league"){
    if (id && id!==S.leagueId){ S.leagueId = id; S.open.clear(); S.weeksShown = 2; S.draftQ = ""; S.draftPool = "all"; S.recapWeek = null; S.dAtDirty = false; S.reset.add("dAt"); }
    S.tab = tab || "league";
  }
  render(); try{ window.scrollTo(0,0); }catch(_){}
  if (A && view==="league") A.refresh();      // make sure the league is current when it's opened
}

function applyTheme(){

/* ---------- rendering ---------- */
function render(){
  _games = null;
  const main = $("#main");
  const keep = {}; main.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=> keep[e.id]=e.value);
  const scrolls = {}; main.querySelectorAll("[data-keep]").forEach(e=> scrolls[e.dataset.keep]=e.scrollTop);
  const ae = document.activeElement, fid = ae && main.contains(ae) ? ae.id : null;
  let sel = null; try{ if (fid && ae.selectionStart!=null) sel=[ae.selectionStart, ae.selectionEnd]; }catch(_){}

  const L = league();
  const view = S.view==="league" && !L ? "home" : S.view;
  $("#tabsNav").hidden = view!=="league";
  $("#chatTab").hidden = !hasV3();
  if (S.chatConn && !(view==="league" && S.tab==="chat" && L && S.chat && S.chat.id===L.id)) stopChat();
  $("#signBtn").hidden = !(A && S.auth.live && !meId()) || view==="auth";
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", String(view==="league" && b.dataset.tab===S.tab)));
  renderLeagueSel(view);
  if (S.db===null) main.innerHTML = `<section class="card empty"><strong>League data isn't available here.</strong>Open this page in Claude while signed in to see your leagues.</section>`;
  else if (!S.leaguesLoaded) main.innerHTML = `<section class="card empty"><strong>Opening The Portfolio…</strong>Your leagues, standings and results load from the shared league file.</section>`;
  else if (view==="settings"){ $("#tagline").textContent = "Settings"; renderTickerAll(); main.innerHTML = settingsHTML(); }
  else if (view==="auth"){ $("#tagline").textContent = "Your account"; renderTickerAll(); main.innerHTML = authHTML(); }
  else if (view==="join"){ $("#tagline").textContent = "Join a league"; renderTickerAll(); main.innerHTML = joinHTML(); }
  else if (view==="mock"){ $("#tagline").textContent = "Practice draft"; renderTickerAll(); main.innerHTML = mockHTML(); }
  else if (view==="home"){ $("#tagline").textContent = "Draft teams, not players. Most wins takes the table."; renderTickerAll(); main.innerHTML = homeHTML(); }
  else {
    const C = compute(L);
    renderTicker(L, C);
    $("#tagline").textContent = `${L.name} · ${SP(L).label} ${seasonLabel(L.year)} · ${L.owners.length} managers`;
    if (S.tab==="chat" && !hasV3() && S.leaguesLoaded && !A) S.tab = "league";
    main.innerHTML = ({league:leagueHTML, team:teamHTML, standings:standingsHTML, board:boardHTML, results:resultsHTML, draft:draftHTML, chat:chatHTML}[S.tab] || leagueHTML)(L, C);
  }
  for (const id in keep){ if (S.reset.has(id)) continue; const el = document.getElementById(id); if (el && el.value!==keep[id]) el.value = keep[id]; }
  S.reset.clear();
  main.querySelectorAll("[data-keep]").forEach(e=>{ if (scrolls[e.dataset.keep]) e.scrollTop = scrolls[e.dataset.keep]; });
  const cl = $("#chatList"); if (cl) cl.scrollTop = cl.scrollHeight;
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); if (sel) try{ el.setSelectionRange(sel[0],sel[1]); }catch(_){} } }
  bind();
  if (S.leaguesLoaded) syncHash();
}

function renderLeagueSel(view){
  const sel = $("#leagueSel");
  const opt = l => `<option value="${esc(l.id)}" ${view==="league"&&l.id===S.leagueId?"selected":""}>${esc(l.name)} · ${SP(l).label} ${seasonLabel(l.year)}</option>`;
  const my = S.leagues.filter(l=>mine(l)), rest = S.leagues.filter(l=>!mine(l));
  sel.innerHTML = `<option value="" ${view!=="league"?"selected":""}>${S.leaguesLoaded?"Home":"Loading…"}</option>`
    + (my.length ? `<optgroup label="My portfolios">${my.map(opt).join("")}</optgroup>` : "")
    + (rest.length ? `<optgroup label="${my.length?"Other leagues":"Leagues"}">${rest.map(opt).join("")}</optgroup>` : "");
}

/* The ticker: latest finals for drafted teams. label(key) returns the manager to show, "" for none, or null when the team is not drafted. */
function paintTicker(games, label, emptyText){
  const items = [];
  const recent = games.filter(g=> label(g.hk)!==null || label(g.ak)!==null).slice(-30).reverse();
  for (const g of recent) for (const side of ["home","away"]){
    const who = label(side==="home"?g.hk:g.ak); if (who===null) continue;
    const m = side==="home"?g.hs:g.as, t = side==="home"?g.as:g.hs;
    const res = m>t?"W":m<t?"L":"T";
    items.push(`<span class="tk"><b>${esc(g[side].toUpperCase())}</b> <span class="${res==="W"?"w":res==="L"?"l":"o"}">${res==="W"?"▲":res==="L"?"▼":"■"} ${res} ${m}–${t}</span>${who?` <span class="o">${esc(who)}</span>`:""}</span>`);
  }
  const html = items.length ? items.join("") : `<span class="tk o">${emptyText}</span>`;
  $("#tickerTrack").innerHTML = items.length ? html+html : html;
}
function renderTicker(L, C){ paintTicker(C.games, k=> C.owner[k] ? C.owner[k].owner : null, "No results yet for this league's teams."); }
function renderTickerAll(){
  const own = new Map();
  for (const l of S.leagues) for (const p of (l.picks||[])) own.set(pk(l,p), p.owner);
  const one = S.leagues.length===1;
  paintTicker(allGames(), k=> own.has(k) ? (one ? own.get(k) : "") : null, S.leagues.length ? "No results yet for drafted teams." : "Results appear here once a league has drafted.");
}

      ${A ? (canAdmin(l)?`<div class="kv"><b>You run this league.</b> Invite managers from its Draft tab.</div>`:"") : `<div class="claim"><label for="cl-${esc(l.id)}">I manage</label><select id="cl-${esc(l.id)}" data-claim="${esc(l.id)}"><option value="">Choose your name</option>${l.owners.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`}
      <div class="btns"><button class="btn primary" data-go="${esc(l.id)}">Open league</button>
      ${canAdmin(l)?`<button class="btn danger" data-dellg="${esc(l.id)}">${S.confirmLg===l.id?"Delete for everyone?":"Delete"}</button>`:""}</div>
      <div class="share"><input type="text" readonly id="ln-${esc(l.id)}" value="${esc(leagueURL(l.id))}" aria-label="Link to ${esc(l.name)}"><button type="button" class="btn" data-copy="ln-${esc(l.id)}">Copy link</button></div>
    </div>`;
  }).join("");

  const how = `<ol class="steps">
      <li class="card"><span class="n">1</span><h3>Draft before the season</h3><p>Managers take turns in a snake draft. Once a team is taken, it's off the board for everyone else in the league.</p></li>

      <tbody>${body}</tbody></table></div>
    <p class="sub">Tap a manager to see their teams. Ties share a rank; order within a tie follows ${C.sp.pro} wins.${wtNote?` ${esc(wtNote)}; the ${C.sp.pro} column shows actual wins.`:""}</p>
    <div class="head-row"><h2>Best in each pool</h2></div>

}

function boardHTML(L, C){
  const owners = L.owners;
  if (!C.picks.length) return `<section class="panel"><div class="card empty"><strong>The board is empty.</strong>Picks appear here as soon as the draft starts.</div></section>`;
  const rows = slotRows(L).map(s=> `<tr><td class="slot">${chip(s.pool)} ${s.many?s.ix:""}</td>${owners.map(o=>{
      const p = C.picks.find(x=>x.owner===o && x.slot===s.slot);
      if (!p) return `<td></td>`;
      const r = C.rec[pk(L,p)]||{w:0,l:0,t:0}, gp = r.w+r.l+r.t, pct = gp? r.w/gp : null;
      return `<td><div class="cell ${pct===null?"":pct>=.7?"hot":pct<=.3?"cold":""}"><span>${esc(p.team)}</span><span class="rec">${r.w}-${r.l}${r.t?"-"+r.t:""}${s.pool==="Any"?` · ${esc(p.pool)}`:""}${p.n?` · pick ${p.n}`:""}</span></div></td>`;
    }).join("")}</tr>`).join("");
  const tot = `<tr><td class="slot">Total</td>${owners.map(o=>`<td class="tot-row">${fmt(C.rows.find(r=>r.owner===o)?.total??0)} W</td>`).join("")}</tr>`;
  return `<section class="panel">
    <div class="head-row"><h2>Rosters</h2><p class="sub">Columns follow draft order. Green edge: winning 70%+. Red edge: 30% or less.</p></div>
    <div class="card scroll"><table class="board"><thead><tr><th>Slot</th>${owners.map(o=>`<th>${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}${tot}</tbody></table></div>
  </section>`;
}

/* ---------- draft ---------- */
function draftState(L){
  const owners = L.owners, N = owners.length, total = N*roundsOf(L);
  const ordered = (L.picks||[]).filter(p=>typeof p.n==="number").sort((a,b)=>a.n-b.n);
  const i = ordered.length, r = Math.floor(i/N), pos = i%N;
  const onClock = i<total ? ((L.draftType==="straight" || r%2===0) ? owners[pos] : owners[N-1-pos]) : null;
  return {owners,N,total,ordered,i,onClock,round:r+1,inRound:pos+1};
}
/* What a manager can still take: required conference/pro slots first, then "any college" slots. */
function needsFor(L, o){
  const req = {}; for (const p of SP(L).pools) req[p] = slotsOf(L)[p]||0;
  let flex = flexOf(L);
  for (const p of (L.picks||[])) if (p.owner===o){ if (String(p.slot).startsWith("Any")) flex--; else req[p.pool]--; }
  return {req, flex};
}
const canTake = (L, need, pool) => need.req[pool]>0 || (pool!==SP(L).pro && need.flex>0);

function draftHTML(L){
  const D = draftState(L), type = L.draftType==="straight"?"Straight":"Snake", sp = SP(L);
  if (L.status!=="drafting"){
    if (!D.i) return `<section class="panel"><div class="head-row"><h2>Draft</h2></div><div class="card empty"><strong>No draft on record.</strong></div></section>`;
    const rounds = Math.ceil(D.i/D.N);
    const rows = Array.from({length:rounds},(_,r)=> `<tr><td class="slot">Rd ${r+1}</td>${D.owners.map(o=>{
        const p = D.ordered.find(x=>x.owner===o && Math.ceil(x.n/D.N)===r+1);
        return p ? `<td><div class="cell"><span>${esc(p.team)}</span><span class="pkn">#${p.n} ${chip(p.pool)}</span></div></td>` : `<td></td>`;
      }).join("")}</tr>`).join("");
    return `<section class="panel">
      <div class="head-row"><h2>Draft Results</h2><p class="sub">${type} draft · ${D.N} managers · ${rounds} rounds · ${D.i} picks</p></div>
      <div class="card scroll"><table class="board rounds"><thead><tr><th>Round</th>${D.owners.map((o,i)=>`<th>${i+1}. ${esc(o)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      ${!L.mock && canAdmin(L)?`<div class="btns"><button class="btn" id="reopen">Reopen the draft</button><span class="sub">Lets you undo or change the last picks.</span><span class="msg" id="dMsg" role="status"></span></div>`:""}
      ${!L.mock && hasV3()?`<div class="btns"><button type="button" class="btn" data-mock="1">Practice draft</button><span class="sub">Try a draft against auto-pick. Nothing is saved.</span></div>`:""}
      ${seatsHTML(L)}
    </section>`;
  }
  const admin = !L.mock && canAdmin(L), pending = !L.mock && draftPending(L);
  const myPick = L.mock ? D.onClock===L.me : !!(A && meId() && D.onClock && (L.members||{})[D.onClock]===meId());
  const canP = admin || (myPick && !pending);
  const qOn = canQueue(L), qset = qOn && S.queue ? new Set(S.queue.teams.map(t=>String(t).toLowerCase())) : new Set();
  const taken = new Set((L.picks||[]).map(p=>pk(L,p)));
  const need = D.onClock ? needsFor(L, D.onClock) : {req:{},flex:0};
  const q = S.draftQ.trim().toLowerCase();
  const pools = sp.pools.filter(p=> slotsOf(L)[p] || (p!==sp.pro && flexOf(L)));
  const all = pools.filter(p=>S.draftPool==="all"||S.draftPool===p).flatMap(p=>sp.teams[p].map(t=>({t,p})))
    .filter(x=>!taken.has(tk(x.t, lgOfPool(L,x.p))) && (!q || x.t.toLowerCase().includes(q)));
  const list = all.slice(0,150);
  const avail = list.map(x=>{ const inQ = qset.has(x.t.toLowerCase());
    return `<div class="avrow"><button class="av" data-pick="${esc(x.t)}" data-pool="${esc(x.p)}" ${(!canP||!canTake(L,need,x.p))?"disabled":""}><span>${esc(x.t)}</span>${chip(x.p)}</button>${qOn?`<button type="button" class="qb ${inQ?"on":""}" data-q="${esc(x.t)}" aria-label="${inQ?"Remove":"Add"} ${esc(x.t)} ${inQ?"from":"to"} my queue" title="${inQ?"In your queue":"Add to my queue"}">${inQ?"✓":"+"}</button>`:""}</div>`; }).join("");
  const needChips = pools.filter(p=>slotsOf(L)[p]).map(p=>`<span class="need ${need.req[p]>0?"":"done"}">${chip(p)}${need.req[p]>1?` <span class="num" style="font-size:12px">×${need.req[p]}</span>`:""}</span>`).join("")
    + (flexOf(L) ? `<span class="need ${need.flex>0?"":"done"}">${chip("Any")}${need.flex>1?` <span class="num" style="font-size:12px">×${need.flex}</span>`:""}</span>` : "");
  const feed = [...D.ordered].reverse().map(p=>`<div><span class="pk">${Math.ceil(p.n/D.N)}.${String(((p.n-1)%D.N)+1).padStart(2,"0")}</span>${chip(p.pool)}<span style="flex:1"><b>${esc(p.team)}</b>${p.auto?`<span class="tag-auto" title="Picked automatically when time ran out">auto</span>`:""}</span><span class="sub">${esc(p.owner)}</span></div>`).join("");
  const secs = hasTimer() ? (L.pickSeconds||0) : 0, running = !!(secs && L.clockAt && D.onClock);
  const end = running ? new Date(L.clockAt).getTime() + secs*1000 : 0, left = running ? Math.ceil((end - A.now())/1000) : 0;
  const startMs = pending ? new Date(L.draftAt).getTime() : 0;
  const tm = pending ? `<div class="tm" id="draftCountdown" data-at="${startMs}" data-lg="${esc(L.id)}" role="timer" aria-label="Time until the draft"><div class="t">${leftText(Math.ceil((startMs-A.now())/1000))}</div><div class="lab">until the draft opens</div></div>`
    : !secs || !D.onClock ? "" : running
    ? `<div class="tm ${left<=10?"low":""}" id="pickClock" data-end="${end}" data-lg="${esc(L.id)}" role="timer" aria-label="Time left to pick"><div class="t">${leftText(left)}</div><div class="lab">${left>0?"left to pick":"Time's up. Auto-picking…"}</div></div>`
    : `<div class="tm paused"><div class="t">Clock stopped</div><div class="lab">${spanText(secs)} per pick</div></div>`;
  S.reset.add("tmSec"); if (!S.dAtDirty) S.reset.add("dAt");
  const sched = hasV3();
  const timerCtl = !(admin && hasTimer() && D.onClock) ? "" : `<div class="card form"><div class="head-row"><h3>Draft clock</h3><span class="sub">${pending?"Scheduled":!secs?"No timer":running?"Running":"Stopped"}</span></div>
      <div class="form-grid"><label class="f" for="tmSec">Time for each pick<select id="tmSec">${timerOpts(secs)}</select></label>
        ${sched?`<label class="f" for="dAt">Draft date and time (optional)<input type="datetime-local" id="dAt" value="${L.draftAt?toLocalInput(L.draftAt):""}"></label>`:""}</div>
      <div class="btns">${running?`<button type="button" class="btn" id="tmPause">Pause the clock</button>`:`<button type="button" class="btn primary" id="tmStart">${pending?"Start now instead":"Start the clock"}</button>`}
        ${sched?`<button type="button" class="btn" id="dSave">${L.draftAt?"Change the start time":"Schedule the draft"}</button>${L.draftAt?`<button type="button" class="btn" id="dClear">Remove the start time</button>`:""}`:""}<span class="msg" id="tmMsg" role="status"></span></div>
      <p class="sub">When a manager's time runs out, their queue is used first, then the best team still available for one of their open spots. Those picks are marked "auto". The clock restarts after every pick.${sched?" If you schedule the draft, managers can't pick before that time, and the clock starts by itself when it arrives.":""}</p></div>`;
  const order = D.owners.map((o,ix)=>`<span class="pill" style="${o===D.onClock?"border-color:var(--accent);font-weight:700":""}">${ix+1}. ${esc(o)}</span>`).join("");
  return `<section class="panel">

/* ---------- league home: recap, preview, projection, history ---------- */
/* Recaps and previews come out on Central time: the recap Tuesday at 8:00 AM, the preview Wednesday at 8:00 AM. */
function centralNow(){
  if (window.PF_TEST_NOW) return window.PF_TEST_NOW;
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {date:`${p.year}-${p.month}-${p.day}`, hour:(+p.hour)%24};
  }catch(_){ return {date:todayISO(), hour:new Date().getHours()}; }
}
const addDays = (s, n) => iso(new Date(toD(s).getTime() + n*864e5));
const listNames = a => a.length<=1 ? (a[0]||"") : a.length===2 ? a.join(" and ") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];
function latestRecapWeek(){ const n = centralNow(), ws = weekStart(n.date); return addDays(ws, (n.date===ws && n.hour<8) ? -14 : -7); }
function previewReady(){ const n = centralNow(), ws = weekStart(n.date), wed = addDays(ws,1); return n.date>wed || (n.date===wed && n.hour>=8); }
const weekNoOf = (C, ws) => C.games.length ? Math.round((toD(ws)-toD(weekStart(C.games[0].date)))/(7*864e5))+1 : 1;

/* Totals and ranks counting only games through endDate. */
function tableAt(L, C, endDate){
  const tot = {}; for (const o of L.owners) tot[o] = 0;
  for (const g of C.games){
    if (g.date > endDate) break;
    const k = winnerKey(g), p = k && C.owner[k];
    if (p) tot[p.owner] += weightOf(L, p.pool);
  }
  const order = [...L.owners].sort((a,b)=> tot[b]-tot[a]), rank = {};
  order.forEach((o,i)=>{ rank[o] = (i>0 && tot[o]===tot[order[i-1]]) ? rank[order[i-1]] : i+1; });
  return {tot, rank, order};
}

function recapData(L, C, ws){
  const we = weekEnd(ws);
  const games = C.games.filter(g=> g.date>=ws && g.date<=we && (C.owner[g.hk] || C.owner[g.ak]));
  if (!games.length) return null;
  const before = tableAt(L, C, addDays(ws,-1)), after = tableAt(L, C, we);
  const started = L.owners.some(o=>before.tot[o]>0);
  const wk = {}; for (const o of L.owners) wk[o] = {w:0, l:0};
  for (const g of games){
    const win = winnerKey(g);
    for (const k of [g.hk, g.ak]){ const p = C.owner[k]; if (!p || win===null) continue; if (win===k) wk[p.owner].w += weightOf(L,p.pool); else wk[p.owner].l++; }
  }
  const rows = after.order.map(o=>({owner:o, wk:wk[o].w, lost:wk[o].l, total:after.tot[o], rank:after.rank[o], move: started ? before.rank[o]-after.rank[o] : 0}));
  const lead = rows.filter(r=>r.rank===1).map(r=>r.owner), prevLead = L.owners.filter(o=>before.rank[o]===1);
  const best = Math.max(...rows.map(r=>r.wk)), worst = Math.min(...rows.map(r=>r.wk));
  const winners = rows.filter(r=>r.wk===best).map(r=>r.owner), losers = rows.filter(r=>r.wk===worst).map(r=>r.owner);
  const gap = t => { const v = [...new Set(Object.values(t.tot))].sort((a,b)=>b-a); return v.length>1 ? v[0]-v[1] : 0; };
  const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
  const climber = [...rows].sort((a,b)=>b.move-a.move)[0];
  let head;
  if (!started) head = lead.length===1 ? `${lead[0]} jumps out in front` : `${listNames(lead)} share the early lead`;
  else if (lead.length===1 && !sameSet(lead, prevLead)) head = prevLead.includes(lead[0]) ? `${lead[0]} takes sole possession of first` : `${lead[0]} takes over first place`;
  else if (lead.length>1 && !sameSet(lead, prevLead)) head = `${listNames(lead)} tied at the top`;
  else if (climber && climber.move>=2) head = `${climber.owner} climbs to ${ordinal(climber.rank)}`;
  else if (lead.length===1 && gap(after)>gap(before)) head = `${lead[0]} stretches the lead to ${fmt(gap(after))}`;
  else if (lead.length===1 && gap(after)<gap(before)) head = `The pack closes to within ${fmt(gap(after))} of ${lead[0]}`;
  else head = `${listNames(winners)} win${winners.length===1?"s":""} the week with ${fmt(best)}`;
  const label = (g, k) => { const p = C.owner[k]; return (p ? p.owner+"'s " : "") + (k===g.hk ? g.home : g.away); };
  const line = g => { const hw = g.hs>g.as, wkk = hw?g.hk:g.ak, lk = hw?g.ak:g.hk; return `${label(g,wkk)} beat ${label(g,lk)}, ${Math.max(g.hs,g.as)}–${Math.min(g.hs,g.as)}`; };
  const decided = games.filter(g=>g.hs!==g.as);
  const h2h = decided.filter(g=> C.owner[g.hk] && C.owner[g.ak] && C.owner[g.hk].owner!==C.owner[g.ak].owner);
  const byMargin = [...decided].sort((a,b)=> Math.abs(a.hs-a.as)-Math.abs(b.hs-b.as));
  const notes = [];
  for (const g of h2h.slice(0,4)) notes.push(["Head to head", line(g)]);
  if (byMargin.length){ notes.push(["Closest game", line(byMargin[0])]); if (byMargin.length>1) notes.push(["Biggest win", line(byMargin[byMargin.length-1])]); }
  return {ws, we, weekNo:weekNoOf(C, ws), head, rows, winners, losers, best, worst, notes, count:games.length};
}

function recapHTML(L, C){
  const latest = latestRecapWeek();
  const weeks = [...new Set(C.games.filter(g=>C.owner[g.hk]||C.owner[g.ak]).map(g=>weekStart(g.date)))].filter(w=>w<=latest).sort();
  if (!weeks.length) return `<article class="card wk"><div class="sport-tag">Weekly recap</div><p class="sub">The first recap arrives the Tuesday morning after this league's teams play.</p></article>`;
  const ws = weeks.includes(S.recapWeek) ? S.recapWeek : weeks[weeks.length-1], ix = weeks.indexOf(ws);
  const R = recapData(L, C, ws), me = mine(L);
  const mv = r => r.move>0 ? `<span class="delta up">▲${r.move}</span>` : r.move<0 ? `<span class="mv-dn">▼${-r.move}</span>` : `<span class="delta zero">–</span>`;
  return `<article class="card wk">
    <div class="wk-top"><span class="sport-tag">Weekly recap · ${fmtShort(R.ws)}–${fmtShort(R.we)}</span>
      <span class="wk-nav"><button type="button" class="ib" data-recap="${ix>0?weeks[ix-1]:""}" ${ix>0?"":"disabled"} aria-label="Earlier recap">‹</button><button type="button" class="ib" data-recap="${ix<weeks.length-1?weeks[ix+1]:""}" ${ix<weeks.length-1?"":"disabled"} aria-label="Later recap">›</button></span></div>
    <h3 class="wk-title">Week ${R.weekNo} Recap: ${esc(R.head)}</h3>
    <p class="wk-lede">Best week: <b>${esc(listNames(R.winners))}</b> with ${fmt(R.best)}.${R.worst<R.best?` Toughest: <b>${esc(listNames(R.losers))}</b> with ${fmt(R.worst)}.`:""} ${R.count} game${R.count===1?"":"s"} involved this league's teams.</p>
    <div class="scroll"><table class="st mini"><thead><tr><th>#</th><th>Manager</th><th class="r">Week</th><th class="r">Total</th><th class="r">Move</th></tr></thead>
      <tbody>${R.rows.map(r=>`<tr><td class="rk num">${r.rank}</td><td><span class="mgr">${esc(r.owner)}</span>${r.owner===me?` <span class="tag">you</span>`:""}</td><td class="r num delta ${r.wk?"up":"zero"}">${r.wk?"+"+fmt(r.wk):"–"}</td><td class="r num">${fmt(r.total)}</td><td class="r num">${mv(r)}</td></tr>`).join("")}</tbody></table></div>
    ${R.notes.length?`<ul class="wk-notes">${R.notes.map(([k,v])=>`<li><span class="k">${k}</span>${esc(v)}</li>`).join("")}</ul>`:""}
  </article>`;
}

/* Upcoming games come from the schedule feed. Games that already have a final are left out. */
function upcoming(L, C, ws){
  const sp = SP(L), we = weekEnd(ws), done = new Set(C.games.filter(g=>g.date>=ws&&g.date<=we).map(g=> g.hk<g.ak ? g.hk+"|"+g.ak : g.ak+"|"+g.hk));
  const out = [], seen = new Set();
  for (const d of S.schedDocs) for (const g of (d.games||[])){
    const lg = normLg(g.lg || d.lg), date = g.date || d.date;
    if (!/^\d{4}-\d\d-\d\d$/.test(date||"") || date<ws || date>we || !g.home || !g.away || (lg!==sp.pro && lg!==sp.col)) continue;
    const home = canonName(g.home,lg), away = canonName(g.away,lg), hk = tk(home,lg), ak = tk(away,lg), k = hk<ak ? hk+"|"+ak : ak+"|"+hk;
    if (done.has(k) || seen.has(date+k)) continue; seen.add(date+k);
    out.push({date, time:g.time||"", lg, home, away, hk, ak});
  }
  return out.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
}
function previewHTML(L, C){
  const ws = weekStart(centralNow().date), weekNo = weekNoOf(C, ws);
  const tag = `<span class="sport-tag">Weekly preview · ${fmtShort(ws)}–${fmtShort(weekEnd(ws))}</span>`;
  if (!S.schedDocs.length) return `<article class="card wk"><div class="wk-top">${tag}</div><p class="sub">The preview needs the upcoming schedule, which arrives with the live score feed. Once that's connected, each Wednesday morning this card lists the games that matter most for the table.</p></article>`;
  if (!previewReady()) return `<article class="card wk"><div class="wk-top">${tag}</div><p class="sub">This week's preview arrives Wednesday morning.</p></article>`;
  const games = upcoming(L, C, ws).filter(g=> C.owner[g.hk] || C.owner[g.ak]);
  if (!games.length) return `<article class="card wk"><div class="wk-top">${tag}</div><p class="sub">No upcoming games for this league's teams are on the schedule this week.</p></article>`;
  const row = o => C.rows.find(r=>r.owner===o), top = C.rows[0] ? C.rows[0].total : 0;
  const heat = o => Math.max(0, 6 - (top - row(o).total));          // managers near the top make a game matter more
  const scored = games.map(g=>{
    const ho = C.owner[g.hk], ao = C.owner[g.ak], h2h = !!(ho && ao && ho.owner!==ao.owner);
    return {...g, ho, ao, h2h, score: (h2h?100:0) + (ho?heat(ho.owner):0) + (ao?heat(ao.owner):0)};
  }).sort((a,b)=> b.score-a.score || (a.date<b.date?-1:1));
  const watch = scored.slice(0,6), h2hAll = scored.filter(g=>g.h2h), lead = C.rows.filter(r=>r.rank===1).map(r=>r.owner);
  const count = {}; for (const o of L.owners) count[o] = 0;
  for (const g of scored){ if (g.ho) count[g.ho.owner]++; if (g.ao) count[g.ao.owner]++; }
  let head;
  if (h2hAll.length) head = `${h2hAll[0].ao.owner} and ${h2hAll[0].ho.owner} go head to head in ${h2hAll[0].away} at ${h2hAll[0].home}`;
  else if (lead.length===1) head = `${lead[0]} puts the lead on the line with ${count[lead[0]]} team${count[lead[0]]===1?"":"s"} in action`;
  else head = `${listNames(lead)} share first with everything to play for`;
  const why = g => (g.ho && g.ao && !g.h2h) ? `${esc(g.ho.owner)} has both teams, so one win is certain.` : g.h2h ? `Head to head: ${esc(g.ao.owner)} against ${esc(g.ho.owner)}. One of them picks up a win.`
    : (()=>{ const p = g.ho || g.ao, r = row(p.owner); return `${esc(p.owner)} (${r.rank===1?"1st":ordinal(r.rank)}, ${fmt(r.total)} wins) has ${esc(p.team)}.`; })();
  const fmtT = t => { const m = /^(\d{1,2}):(\d\d)/.exec(t||""); if (!m) return ""; const h = +m[1]; return ` · ${((h+11)%12)+1}:${m[2]} ${h<12?"AM":"PM"}`; };
  return `<article class="card wk">
    <div class="wk-top">${tag}</div>
    <h3 class="wk-title">Week ${weekNo} Preview: ${esc(head)}</h3>
    <ul class="wk-games">${watch.map(g=>`<li><div class="mt"><b>${esc(g.away)}</b> at <b>${esc(g.home)}</b> <span class="lg">${g.lg}</span></div><div class="sub">${fmtDay(g.date)}${fmtT(g.time)}</div><div class="why">${why(g)}</div></li>`).join("")}</ul>
    <p class="sub">Teams in action this week: ${C.rows.map(r=>`${esc(r.owner)} ${count[r.owner]}`).join(" · ")}</p>
  </article>`;
}

/* Projection: each team keeps winning at its current pace for the rest of its regular season. */
const SEASON_GAMES = {NFL:17, CFB:12, NBA:82, CBB:31};
function projection(L, C){
  const rows = C.rows.map(r=>{
    let proj = 0;
    for (const h of r.holdings){ const gp = h.w+h.l+h.t, left = Math.max(0, SEASON_GAMES[lgOfPool(L,h.pool)] - gp); proj += (h.w + left*(h.w+2)/(gp+4)) * h.wt; }
    return {owner:r.owner, total:r.total, rank:r.rank, proj};
  }).sort((a,b)=> b.proj-a.proj);
  rows.forEach((r,i)=>{ r.projRank = (i>0 && Math.abs(r.proj-rows[i-1].proj)<0.05) ? rows[i-1].projRank : i+1; });
  return rows;
}
function projectionHTML(L, C){
  if (!C.picks.length || !C.games.length) return "";
  const P = projection(L, C), me = mine(L), max = Math.max(1, ...P.map(r=>r.proj)), sp = C.sp;
  return `<div class="head-row"><h2>Projected finish</h2><p class="sub">Where the table ends up if every team keeps its current pace.</p></div>
    <div class="card scroll"><table class="st mini"><thead><tr><th>#</th><th>Manager</th><th class="r">Now</th><th class="r">Projected</th><th class="r hide-sm">Now ranked</th></tr></thead>
    <tbody>${P.map(r=>`<tr><td class="rk num">${r.projRank}</td><td><span class="mgr">${esc(r.owner)}</span>${r.owner===me?` <span class="tag">you</span>`:""}<div class="bar"><i style="width:${(r.proj/max*100).toFixed(1)}%"></i></div></td><td class="r num">${fmt(r.total)}</td><td class="r num tot">${r.proj.toFixed(1)}</td><td class="r num hide-sm">${ordinal(r.rank)}${r.projRank<r.rank?` <span class="delta up">▲${r.rank-r.projRank}</span>`:r.projRank>r.rank?` <span class="mv-dn">▼${r.projRank-r.rank}</span>`:""}</td></tr>`).join("")}</tbody></table></div>
    <p class="sub">Each team's pace over the rest of its regular season (${SEASON_GAMES[sp.pro]} ${sp.pro} games, ${SEASON_GAMES[sp.col]} college), leaning slightly toward .500 early on. Postseason games aren't projected.</p>`;
}

function seasonRecords(L, C){
  const out = [], weeks = [...new Set(C.games.map(g=>weekStart(g.date)))].sort();
  let bw = null;
  for (const ws of weeks){ const R = recapData(L, C, ws); if (R && (!bw || R.best>bw.best)) bw = R; }
  if (bw && bw.best>0) out.push(["Best week", `${listNames(bw.winners)}, ${fmt(bw.best)} wins in Week ${bw.weekNo}`]);
  const teams = C.rows.flatMap(r=>r.holdings.map(h=>({...h, owner:r.owner}))).filter(h=>h.w+h.l+h.t>0).sort((a,b)=> b.w-a.w || a.l-b.l);
  if (teams.length) out.push(["Top team", `${teams[0].team} (${teams[0].owner}), ${teams[0].w}-${teams[0].l}${teams[0].t?"-"+teams[0].t:""}`]);
  const un = teams.filter(h=>h.l===0 && h.t===0 && h.w>=3);
  if (un.length) out.push(["Still unbeaten", un.length<=5 ? un.map(h=>`${h.team} (${h.owner})`).join(", ") : `${un.length} drafted teams`]);
  return out;
}
function historyHTML(L, C){

    ${rec.length?`<ul class="wk-notes card" style="padding:12px 14px">${rec.map(([k,v])=>`<li><span class="k">${k}</span>${esc(v)}</li>`).join("")}</ul>`:""}
    ${H.length?`<div class="card scroll"><table class="st mini"><thead><tr><th>Season</th><th>Champion</th><th class="r">Wins</th><th class="hide-sm">Note</th>${admin?"<th></th>":""}</tr></thead><tbody>${rows}</tbody></table></div>`

      <label class="f" for="hWins">Wins<input type="number" id="hWins" min="0" step="0.5" inputmode="decimal"></label>
      <label class="f" for="hNote">Note (optional)<input type="text" id="hNote" maxlength="80"></label></div>
      <datalist id="hOwners">${L.owners.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>
      <div class="btns"><button class="btn" type="submit">Add to history</button><span class="msg" id="hMsg" role="status"></span></div></form>`:""}`;
}

const fmtWhen = s => new Date(s).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const toLocalInput = s => { const d = new Date(s), z = n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };

      : `<div class="card clock"><div><div class="meta">Draft in progress · pick ${Math.min(D.i+1,D.total)} of ${D.total}</div><div class="who">${esc(D.onClock||"Done")}</div><div class="sub" style="margin-top:6px">${myTurn?"You're on the clock.":"is on the clock."}</div></div>

    ? `${recapHTML(L, C)}${previewHTML(L, C)}${projectionHTML(L, C)}`

      : (L.status==="drafting" ? "" : `<div class="card empty"><strong>No rosters yet.</strong>This league hasn't drafted.</div>`));
  return `<section class="panel">
    <div class="head-row"><h2>${esc(L.name)}</h2><p class="sub">${SP(L).label} ${seasonLabel(L.year)} · ${L.owners.length} managers · ${esc(slotText(L))}</p></div>

}

/* ---------- chat ---------- */
function startChat(id){
  if (S.chatConn) S.chatConn.close();
  S.chat = {id, msgs:[], loaded:false, err:"", sig:""};
  S.chatConn = A.openChat(id, res=>{
    if (!S.chat || S.chat.id!==id) return;
    const sig = (res.error||"") + "|" + res.messages.length + "|" + (res.messages.length ? res.messages[res.messages.length-1].id : 0);
    const changed = sig!==S.chat.sig || !S.chat.loaded;
    S.chat.msgs = res.messages; S.chat.err = res.error||""; S.chat.loaded = true; S.chat.sig = sig;
    if (changed && S.view==="league" && S.tab==="chat" && S.leagueId===id){ S.chatStick = true; render(); }
  });
}
function stopChat(){ if (S.chatConn){ S.chatConn.close(); S.chatConn = null; } S.chat = null; }
function chatHTML(L){
  const wrap = inner => `<section class="panel"><div class="head-row"><h2>League chat</h2><p class="sub">Only this league's managers can read and post here.</p></div>${inner}</section>`;
  if (!hasV3()) return wrap(`<div class="card empty"><strong>Chat isn't available right now.</strong>${A?"It switches on once the site's database is updated.":"Chat is part of the website version of The Portfolio."}</div>`);
  if (!meId()) return wrap(`<div class="card empty"><strong>Sign in to chat.</strong>Chat is for the managers in this league.<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn primary" data-auth="in">Sign in</button></div></div>`);
  if (!mine(L) && !canAdmin(L)) return wrap(`<div class="card empty"><strong>Chat is for this league's managers.</strong>Join with the commissioner's invite link to take part.</div>`);
  if (!S.chat || S.chat.id!==L.id) startChat(L.id);
  const c = S.chat, admin = canAdmin(L), uid = meId();
  const day = s => new Date(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  let last = "";
  const list = c.msgs.map(m=>{
    const d = day(m.created_at), sep = d!==last ? `<div class="chat-day">${d}</div>` : ""; last = d;
    const mineMsg = m.user_id===uid;
    return `${sep}<div class="cm ${mineMsg?"me":""}"><div class="cm-h"><b>${esc(m.name)}</b><span>${new Date(m.created_at).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}</span>${(mineMsg||admin)?`<button type="button" class="x" data-mdel="${m.id}" aria-label="Delete message">✕</button>`:""}</div><div class="cm-b">${esc(m.body)}</div></div>`;
  }).join("");
  return wrap(`<div class="card chat">
      <div class="chat-list" id="chatList" aria-live="polite">${!c.loaded ? `<p class="sub">Loading messages…</p>` : c.err ? `<p class="msg err">${esc(c.err)}</p>` : (list || `<p class="sub">No messages yet. Say something to get it started.</p>`)}</div>
      <form class="chat-form" id="chatForm" autocomplete="off"><input type="text" id="chatBody" maxlength="500" placeholder="Message the league" aria-label="Message" required><button class="btn primary" type="submit">Send</button></form>
      <span class="msg" id="chatMsg" role="status" style="padding:0 12px 8px"></span></div>`);
}

/* ---------- draft queue (website only) ---------- */
const poolOfTeam = (L, team) => SP(L).pools.find(p=> SP(L).teams[p].some(t=>t.toLowerCase()===String(team).toLowerCase())) || null;
const canQueue = L => !!(hasV3() && !L.mock && L.status==="drafting" && meId() && mine(L));
function ensureQueue(L){
  if (S.queue && S.queue.id===L.id) return;
  const q = S.queue = {id:L.id, teams:[], loaded:false};
  A.getQueue(L.id).then(t=>{ q.teams = Array.isArray(t)?t:[]; }).catch(()=>{}).then(()=>{ q.loaded = true; if (S.queue===q) render(); });
}
async function saveQueue(teams){
  const q = S.queue; if (!q) return;
  q.teams = teams; render();
  try{ await A.setQueue(q.id, teams); }catch(err){ setMsg("#qMsg", failText(err)); }
}
function queueHTML(L){
  if (!canQueue(L)) return "";
  ensureQueue(L);
  const q = S.queue, taken = new Set((L.picks||[]).map(p=>pk(L,p))), need = needsFor(L, mine(L));
  const live = q.teams.map(t=>({t, p:poolOfTeam(L,t)})).filter(x=> x.p && !taken.has(tk(x.t, lgOfPool(L,x.p))));
  const items = live.map((x,i)=>`<li class="${canTake(L,need,x.p)?"":"full"}"><span class="ord">${i+1}</span>${chip(x.p)}<span class="who">${esc(x.t)}</span>${canTake(L,need,x.p)?"":`<span class="sub">spot filled</span>`}
      <button type="button" class="ib" data-qmv="${i}|-1" ${i?"":"disabled"} aria-label="Move ${esc(x.t)} up">↑</button>
      <button type="button" class="ib" data-qmv="${i}|1" ${i<live.length-1?"":"disabled"} aria-label="Move ${esc(x.t)} down">↓</button>
      <button type="button" class="ib" data-qrm="${esc(x.t)}" aria-label="Remove ${esc(x.t)} from queue">✕</button></li>`).join("");
  return `<details class="card qcard" ${S.queueShut?"":"open"} id="qCard"><summary><span>My queue</span><span class="sub">${q.loaded ? `${live.length} team${live.length===1?"":"s"}` : "Loading…"}</span></summary>
    <div class="form" style="padding-top:0"><p class="sub">Add teams with the + next to each name. If your time runs out, auto-pick takes the first one here that is still on the board and fits an open spot. Only you can see your queue.</p>
    <ol class="mgr-list">${items || `<li><span class="sub">Nothing queued yet.</span></li>`}</ol><span class="msg" id="qMsg" role="status"></span></div></details>`;
}

/* ---------- practice draft: you against auto-pick, nothing saved ---------- */
function slotFor(L, need, pool){
  if (need.req[pool]>0){ const n = slotsOf(L)[pool]; return n>1 ? `${pool} #${n-need.req[pool]+1}` : pool; }
  const f = flexOf(L); return f>1 ? `Any #${f-need.flex+1}` : "Any";
}
function openMock(base){
  S.mock = {L:null, busy:false, err:"", sport: base ? sportOf(base) : "football", n: base ? base.owners.length : 10, pos:"r", slots: base && base.slots ? {...base.slots} : null, flex: base ? flexOf(base) : 0, from: base ? base.name : ""};
  S.view = "mock"; S.draftQ = ""; S.draftPool = "all"; render(); try{ window.scrollTo(0,0); }catch(_){}
}
async function startMock(){
  const M = S.mock, sp = SPORTS[M.sport];
  M.busy = true; M.err = ""; render();
  try{
    const ranks = await A.ranks(M.sport);
    const n = Math.max(2, Math.min(16, M.n|0)), pos = M.pos==="r" ? 1+Math.floor(Math.random()*n) : Math.min(n, +M.pos);
    const owners = Array.from({length:n}, (_,i)=> i+1===pos ? "You" : "Auto "+(i+1));
    M.ranks = ranks;
    M.L = {id:"practice", mock:true, me:"You", name:"Practice draft", sport:M.sport, year:thisSeason(), owners, slots: M.slots || {...sp.slots}, flex: M.slots ? M.flex : sp.flex, weights:{...sp.weights}, draftType:"snake", status:"drafting", picks:[]};
  }catch(err){ M.err = failText(err); }
  M.busy = false; render(); botLoop();
}
function botLoop(){
  const M = S.mock; if (!M || !M.L || S.view!=="mock") return;
  const L = M.L, D = draftState(L);
  if (L.status!=="drafting" || !D.onClock || D.onClock===L.me) return;
  clearTimeout(M.timer);
  M.timer = setTimeout(()=>{
    if (S.mock!==M || S.view!=="mock") return;
    const D2 = draftState(L), bot = D2.onClock; if (!bot || bot===L.me) return;
    const need = needsFor(L, bot), taken = new Set(L.picks.map(p=>pk(L,p)));
    const opts = M.ranks.filter(t=> canTake(L, need, t.pool) && !taken.has(tk(t.team, lgOfPool(L,t.pool)))).slice(0,3);
    if (!opts.length){ L.status = "complete"; render(); return; }
    const roll = Math.random(), c = opts[roll<0.6 ? 0 : roll<0.9 ? Math.min(1,opts.length-1) : opts.length-1];
    L.picks.push({n:D2.i+1, owner:bot, team:c.team, pool:c.pool, slot:slotFor(L, need, c.pool), auto:true});
    if (L.picks.length>=D2.total) L.status = "complete";
    render(); botLoop();
  }, 420);
}

  if (!M.L){
    const sp = SPORTS[M.sport];
    return `<section class="panel auth"><div class="head-row"><h2>Practice draft</h2></div>

    ${draftHTML(L)}`;
}

/* ---------- pick clock ---------- */
/* Updates the countdown in place. When it reaches zero, any signed-in viewer asks the database to make the pick;
   the database checks the time itself, so asking early or twice does nothing. */
let autoBusy = false, autoNext = 0;
async function askAutoPick(id){
  if (autoBusy || Date.now() < autoNext) return;
  autoBusy = true; autoNext = Date.now() + 2500 + Math.random()*1500;
  try{ if (meId()){ const n = await A.autoPick(id); if (!n) await A.refresh(); } else await A.refresh(); }catch(_){}
  finally{ autoBusy = false; }
}
let startBusy = false, startNext = 0;
async function askStart(id){
  if (startBusy || Date.now() < startNext) return;
  startBusy = true; startNext = Date.now() + 3000 + Math.random()*1500;
  try{ if (meId()) await A.startIfDue(id); else await A.refresh(); }catch(_){}
  finally{ startBusy = false; }
}
function tickClock(){
  const dc = $("#draftCountdown");
  if (dc && A){
    const left = Math.ceil((+dc.dataset.at - A.now())/1000), t = dc.querySelector(".t"), txt = left>0 ? leftText(left) : "0:00";
    if (t.textContent !== txt) t.textContent = txt;
    if (left <= 0 && S.auth.live) askStart(dc.dataset.lg);
  }
  const el = $("#pickClock"); if (!el || !A) return;
  const left = Math.ceil((+el.dataset.end - A.now())/1000);
  const t = el.querySelector(".t"), lab = el.querySelector(".lab"), txt = leftText(left);
  if (t.textContent !== txt) t.textContent = txt;
  el.classList.toggle("low", left <= 10);
  const lt = left>0 ? "left to pick" : "Time's up. Auto-picking…"; if (lab.textContent !== lt) lab.textContent = lt;
  if (left <= 0 && S.auth.live) askAutoPick(el.dataset.lg);
}
setInterval(tickClock, 250);

function setMsg(id, text, ok){ const m=$(id); if(m){ m.textContent=text; m.className="msg "+(ok?"ok":"err"); } }
function failText(e){ return e?.code==="backend" ? e.message : e?.code==="invalid_argument" ? "You don't have permission to change league data." : e?.code==="quota_exceeded" ? "The league file is full." : "That didn't save. Check your connection and try again."; }

async function addGame(e){
  e.preventDefault();
  const date=$("#gDate").value, lg=$("#gLg").value, home=canonName($("#gHome").value,lg), away=canonName($("#gAway").value,lg);
  const hs=parseInt($("#gHs").value,10), as=parseInt($("#gAs").value,10);
  if(!date||!home||!away||isNaN(hs)||isNaN(as)) return setMsg("#gMsg","Fill in both teams, both scores and the date.");
  if(tk(home,lg)===tk(away,lg)) return setMsg("#gMsg","A team can't play itself.");
  const ref = S.db.doc(`games/${date}`);
  try{
    const snap = await ref.get();
    const games = snap.exists ? (snap.data().games||[]).filter(g=> !(normLg(g.lg)===lg && tk(g.home,lg)===tk(home,lg) && tk(g.away,lg)===tk(away,lg))) : [];
    games.push({lg, home, away, hs, as});
    await ref.set({date, games});
    ["gHome","gHs","gAway","gAs"].forEach(id=>S.reset.add(id));
    render();
    setMsg("#gMsg",`Saved: ${away} ${as}, ${home} ${hs}. ${hs===as?"Tie":(hs>as?home:away)+" win"}.`,true);
    $("#gHome")?.focus();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}
async function delGame(id){
  if(S.confirmDel!==id){ S.confirmDel=id; return render(); }
  S.confirmDel=null;
  const [docId,lg,home,away]=id.split("|");
  const ref=S.db.doc(`games/${docId}`);
  try{
    const snap=await ref.get(); if(!snap.exists) return render();
    const d=snap.data(), games=(d.games||[]).filter(g=> !(normLg(g.lg||d.lg)===lg && g.home===home && g.away===away));
    if(games.length || d.src==="auto") await ref.set({...d, games}); else await ref.delete();
  }catch(err){ setMsg("#gMsg",failText(err)); }
}

async function makePick(team, pool){
  const L=league(), D=draftState(L); if(!D.onClock) return;
  const lg = lgOfPool(L, pool);
  team = canonName(team, lg);
  if ((L.picks||[]).some(p=>pk(L,p)===tk(team,lg))) return setMsg("#dMsg",`${team} is already drafted.`);
  const need = needsFor(L, D.onClock);
  if (!canTake(L, need, pool)) return setMsg("#dMsg",`${D.onClock} has no open slot for a ${pool} team.`);
  const slot = slotFor(L, need, pool);
  if (L.mock){
    if (D.onClock!==L.me) return;
    L.picks.push({n:D.i+1, owner:D.onClock, team, pool, slot}); if (L.picks.length>=D.total) L.status = "complete";
    S.draftQ = ""; S.reset.add("dq"); render(); botLoop(); return;
  }
  const picks = [...(L.picks||[]), {n:D.i+1, owner:D.onClock, team, pool, slot}];
  try{
    if (A) await A.makePick(L.id, team, pool, slot);
    else await S.db.doc(`leagues/${L.id}`).update({picks, status: picks.length>=D.total?"complete":"drafting"});
    S.draftQ=""; S.reset.add("dq"); S.reset.add("cT"); render();
  }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function undoPick(){
  const L=league(), D=draftState(L); if(!D.i) return;
  const last=D.ordered[D.ordered.length-1];
  try{ await S.db.doc(`leagues/${L.id}`).update({picks:(L.picks||[]).filter(p=>p.n!==last.n), status:"drafting"}); }
  catch(err){ setMsg("#dMsg",failText(err)); }
}
async function reopenDraft(){
  try{ await S.db.doc(`leagues/${league().id}`).update({status:"drafting"}); }catch(err){ setMsg("#dMsg",failText(err)); }
}
async function createLeague(e){
  e.preventDefault();
  const sport = S.newSport, sp = SPORTS[sport];
  const name=$("#lgName").value.trim(), year=+$("#lgYear").value, draftType=$("#lgType").value, owners=[...S.newMgrs];
  const slots={}; for(const p of sp.pools){ const el=$("#sl-"+poolCls(p)); slots[p]= el ? Math.max(0,Math.min(10,parseInt(el.value,10)||0)) : 0; }
  const flex = $("#lgFlex") ? Math.max(0,Math.min(12,parseInt($("#lgFlex").value,10)||0)) : 0;
  const weights = {}; if ($("#lgProW") && +$("#lgProW").value!==1) weights[sp.pro] = +$("#lgProW").value;
  if(!name) return setMsg("#lgMsg","Name the league.");
  if(owners.length<2) return setMsg("#lgMsg","Add at least two managers.");
  if(!sp.pools.some(p=>slots[p]) && !flex) return setMsg("#lgMsg","Each manager needs at least one team.");
  for(const p of sp.pools) if(owners.length*slots[p]>sp.teams[p].length) return setMsg("#lgMsg",`${owners.length} managers × ${slots[p]} ${p} teams is more than the ${sp.teams[p].length} ${p} teams available.`);
  let id=(name+"-"+sport+"-"+year).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"league";
  if(S.leagues.some(l=>l.id===id)) id+="-"+Math.random().toString(36).slice(2,6);
  try{
    const doc = {name, sport, year, owners, slots, flex, weights, draftType, status:"drafting", picks:[], created:new Date().toISOString()};
    if ($("#lgTimer") && +$("#lgTimer").value) doc.pickSeconds = +$("#lgTimer").value;
    await S.db.doc(`leagues/${id}`).set(doc);
    S.newMgrs=[]; S.reset.add("lgName"); S.leagueId=id; S.view="league"; S.tab="draft"; render();
  }catch(err){ setMsg("#lgMsg",failText(err)); }
}
async function delLeague(id){
  if(S.confirmLg!==id){ S.confirmLg=id; return render(); }
  S.confirmLg=null;
  try{ await S.db.doc(`leagues/${id}`).delete(); }catch(err){ setMsg("#lgMsg",failText(err)); }
}

/* ---------- boot ---------- */
document.querySelectorAll(".tab").forEach(b=> b.onclick=()=>{ S.tab=b.dataset.tab; S.confirmDel=S.confirmLg=null; render(); if (A) A.refresh(); });
$("#leagueSel").onchange=e=>{ e.target.value ? go("league", e.target.value) : go("home"); };
$("#brandLink").onclick=e=>{ e.preventDefault(); go("home"); };
$("#gearBtn").onclick=()=> go(S.view==="settings" ? "home" : "settings");
$("#signBtn").onclick=()=>{ S.authMode="in"; go("auth"); };
if (A) A.onChange(st=>{
  const was = meId();
  S.auth = {user:st.user, profile:st.profile, live:st.live, timer:!!st.timer, level:st.level||1, google:!!st.google};
  if (st.recovery){ S.view="auth"; S.authMode="newpw"; }
  else if (!was && meId() && (S.view==="auth")) return afterSignIn();
  else if (!was && meId() && S.view==="home" && !S.join){
    // Came back from a confirmation email or Google with an invite still pending: pick it up once.
    try{ const j = JSON.parse(localStorage.getItem("pf-join")||"null"); localStorage.removeItem("pf-join");
      if (j && j.id && Date.now()-j.t < 7*864e5){ S.join = {id:j.id, code:j.code||""}; S.view = "join"; } }catch(_){}
  }
  if (!meId()) S.invites = {};
  render();
});
loadLocal(); applyTheme(); applyHash();
window.addEventListener("hashchange", ()=>{ applyHash(); settleLeague(); render(); if (A && S.view==="league") A.refresh(); });

(async function boot(){
  const db = await (window.claude?.use ? window.claude.use("db") : null);
  S.db = db;
  if(!db){ render(); return; }
  const user = await window.claude.use("user");
  S.canWrite = (user ? await user.can("data.write") : null) !== false;
  db.collection("leagues").limit(200).onSnapshot(q=>{
    const sig = JSON.stringify(q.docs.map(d=>[d.id, d.data()]));
    if (S.leaguesLoaded && sig===S.leagueSig) return;      // routine re-check with nothing new: leave the page alone
    S.leagueSig = sig;
    S.leagues = q.docs.map(d=>({id:d.id, ...d.data()})).filter(l=>l.name && Array.isArray(l.owners)).sort((a,b)=> (a.created||"")<(b.created||"")?-1:1);
    const first = !S.leaguesLoaded; S.leaguesLoaded = true;
    if (first){
      // opened with no address: go straight to your portfolio if you have exactly one
      const my = S.leagues.filter(l=>mine(l));
      let standalone=false; try{ standalone = navigator.standalone===true || matchMedia("(display-mode: standalone)").matches; }catch(_){}
      if (!location.hash && standalone && my.length===1){ S.view="league"; S.wantLeague=my[0].id; S.wantTab="league"; }
    }
    settleLeague(); render();
  }, ()=>{});
  db.collection("games").limit(1000).onSnapshot(q=>{ S.gameDocs = q.docs.map(d=>({_id:d.id, ...d.data()})); render(); }, ()=>{});
  db.doc("meta/sync").onSnapshot(s=>{ S.sync = s.exists ? s.data() : null; render(); }, ()=>{});
  db.collection("schedule").limit(200).onSnapshot(q=>{ S.schedDocs = q.docs.map(d=>({_id:d.id, ...d.data()})); if (S.schedDocs.length) render(); }, ()=>{});
})();
</script>
